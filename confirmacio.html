<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Confirmació del correu · Paideia Education</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#26344c;background:#f5f7fb}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(100%,520px);background:white;border:1px solid #e3e9f2;border-radius:18px;padding:42px 34px;text-align:center;box-shadow:0 18px 55px #263b5c12}
    .logo{width:58px;height:58px;margin:0 auto 22px;border-radius:15px;background:#344d96;color:#fff;font-size:38px;font-weight:750;display:grid;place-items:center}
    .mark{display:grid;place-items:center;margin:0 auto 18px;width:60px;height:60px;border-radius:50%;background:#e8f7ee;color:#23734b;font-size:34px;font-weight:700}
    h1{font-size:25px;letter-spacing:-.6px;margin:0 0 12px}p{font-size:15px;line-height:1.75;color:#627188;margin:0 0 12px}
    footer{margin-top:30px;padding-top:22px;border-top:1px solid #e9edf3;color:#8b97a8;font-size:12px}
    @media(max-width:480px){main{padding:32px 22px}}
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">P</div>
    <div class="mark" aria-hidden="true">✓</div>
    <h1>Correu confirmat!</h1>
    <p>La teva adreça electrònica s’ha verificat correctament a Paideia.</p>
    <p>La confirmació no activa automàticament la recepció de comunicacions.</p>
    <footer>Paideia Education</footer>
  </main>
</body>
</html>
