<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graella de classe</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#252b35;background:#f7f8fa}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}header{background:white;border-bottom:1px solid #e8ebef;padding:23px max(24px,calc((100vw - 1200px)/2));display:flex;justify-content:space-between;align-items:center}header strong{font-size:21px;letter-spacing:-.6px}header span{color:#8a929f;font-size:13px}main{max-width:1200px;margin:42px auto;padding:0 24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}.top h1{margin:0;font-size:28px;letter-spacing:-.8px}.sub{margin:7px 0 0;color:#87909c;font-size:14px}.layout{display:grid;grid-template-columns:245px minmax(0,1fr);gap:24px}.panel{background:white;border:1px solid #e8ebef;border-radius:14px;overflow:hidden}.side{padding:17px}.side-title{font-size:12px;text-transform:uppercase;letter-spacing:1.1px;color:#8d96a2;font-weight:700;margin:6px 8px 15px}.class-btn{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;background:transparent;padding:12px 13px;border-radius:9px;text-align:left;color:#4b5563;margin-bottom:4px}.class-btn.active{background:#eef2ff;color:#4058a8;font-weight:650}.class-btn:hover:not(.active){background:#f6f7f9}.count{font-size:12px;color:#9ba3ae}.add-side{width:100%;background:white;border:1px dashed #d5dbe4;border-radius:9px;padding:12px;color:#687586;margin-top:13px}.add-side:hover{background:#f8faff}.content-head{padding:23px 25px;display:flex;justify-content:space-between;align-items:center;gap:15px;border-bottom:1px solid #edf0f3}.content-head h2{margin:0;font-size:21px;letter-spacing:-.5px}.hint{color:#9aa2ad;font-size:12px;margin-top:5px}.actions{display:flex;gap:9px;flex-wrap:wrap}button.primary{background:#344d96;color:white;border:1px solid #344d96;padding:10px 14px;border-radius:8px;font-size:13px;font-weight:600}button.secondary{background:white;color:#667181;border:1px solid #e0e5eb;padding:10px 13px;border-radius:8px;font-size:13px}button:hover{filter:brightness(.97)}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left}th{background:#fafbfc;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:#9ba4b0;font-weight:700;padding:15px 22px;border-bottom:1px solid #edf0f3}td{padding:11px 22px;border-bottom:1px solid #f0f2f5;font-size:14px}tr:last-child td{border-bottom:0}tbody tr:hover{background:#fafbff}.num{color:#a5adba;width:65px}.grade-input{width:94px;min-width:75px;border:1px solid transparent;background:transparent;border-radius:6px;padding:8px 9px;color:#303946;text-align:center}.grade-input:hover{border-color:#e6eaf0}.grade-input:focus{outline:none;border-color:#a4b2e0;background:white}.item-head{display:flex;align-items:center;gap:5px;white-space:nowrap}.item-edit{border:0;background:transparent;color:inherit;font:inherit;text-transform:inherit;letter-spacing:inherit;cursor:pointer;padding:3px}.item-remove{border:0;background:transparent;color:#b0b8c4;font-size:16px;padding:2px 5px}.item-remove:hover{color:#be4b52}.name-input{border:1px solid transparent;border-radius:6px;background:transparent;padding:8px 9px;width:100%;min-width:130px;color:#303946}.name-input:hover{border-color:#e6eaf0}.name-input:focus{outline:none;border-color:#a4b2e0;background:white}.delete{border:0;background:transparent;color:#aab2bd;font-size:18px;border-radius:6px;padding:5px 10px}.delete:hover{color:#be4b52;background:#fff0f1}.empty{padding:65px 20px;text-align:center;color:#9aa3af;font-size:14px}.calculated{font-weight:650;color:#344d96;text-align:center;white-space:nowrap}.calc-tag{font-size:10px;color:#7e8cb6;margin-left:4px}.modal-back{position:fixed;inset:0;background:#17233b66;display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}.modal{background:white;border-radius:15px;padding:25px;width:min(540px,100%);box-shadow:0 18px 60px #1c2b4933}.modal h3{margin:0 0 9px}.modal p{font-size:13px;color:#7d8795}.modal label{font-size:13px;color:#5d6877;display:block;margin:14px 0 6px}.modal input,.modal select{width:100%;padding:10px;border:1px solid #dce2eb;border-radius:8px;background:white}.weight-row{display:grid;grid-template-columns:1fr 110px;gap:12px;align-items:end}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}.error{color:#bd3d4b!important;min-height:18px}.footer{margin-top:18px;font-size:12px;color:#9ca5b1;text-align:right}@media(max-width:700px){header{padding:20px 24px}.layout{grid-template-columns:1fr}main{margin:25px auto}.content-head{align-items:flex-start;flex-direction:column}.top h1{font-size:24px}}
</style>
</head>
<body>
<header><strong>Graella<span> · Aula</span></strong><span>Espai de gestió de classes</span></header>
<main><div class="top"><div><h1>Les meves classes</h1><p class="sub">Organitza els teus grups i alumnes en un sol lloc.</p></div></div><div class="layout"><aside class="panel side"><div class="side-title">Classes</div><div id="classes"></div><button class="add-side" id="addClass">+ Afegir classe</button></aside><section class="panel"><div class="content-head"><div><h2 id="classTitle"></h2><div class="hint" id="classInfo"></div></div><div class="actions"><button class="secondary" id="renameClass">Canviar nom</button><button class="secondary" id="deleteClass">Eliminar classe</button><button class="secondary" id="addItem">+ Afegir ítem</button><button class="primary" id="addStudent">+ Afegir alumne</button></div></div><div id="tableArea"></div></section></div><div class="footer">Les dades es desen automàticament en aquest navegador.</div></main><div id="modalRoot"></div>
<script>
const KEY='graella-aula-v1';
const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());
let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}
if(!data||!Array.isArray(data.classes)){data={classes:[{id:uid(),name:'1r ESO A',students:[]}],active:null};data.active=data.classes[0].id}
data.classes.forEach(c=>{if(!Array.isArray(c.items))c.items=[];if(!Array.isArray(c.students))c.students=[];c.students.forEach(s=>{if(!s.grades||typeof s.grades!=='object')s.grades={}})});
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function current(){const c=data.classes.find(c=>c.id===data.active)||data.classes[0];if(c){if(!Array.isArray(c.items))c.items=[];if(!Array.isArray(c.students))c.students=[];c.students.forEach(s=>{if(!s.grades||typeof s.grades!=='object')s.grades={}})}return c}
function calcValue(c,s,item,seen=new Set()){
 if(seen.has(item.id))return null;
 if(item.type!=='calculated'){
  const raw=s.grades?.[item.id];if(raw===undefined||String(raw).trim()==='')return null;
  const value=Number(String(raw).replace(',','.'));return Number.isFinite(value)?value:null;
 }
 if(!Array.isArray(item.weights)||!item.weights.length)return null;
 const next=new Set(seen);next.add(item.id);let result=0;
 for(const part of item.weights){const source=c.items.find(x=>x.id===part.id);if(!source)return null;const value=calcValue(c,s,source,next);if(value===null)return null;result+=value*Number(part.percent)/100}
 return Number.isFinite(result)?result:null;
}
function refreshCalculated(c){document.querySelectorAll('[data-calc]').forEach(el=>{const student=c.students.find(s=>s.id===el.dataset.student);const item=c.items.find(x=>x.id===el.dataset.calc);if(!student||!item)return;const value=calcValue(c,student,item);el.textContent=value===null?'—':value.toFixed(2).replace('.',',')})}
function render(){
 const list=document.getElementById('classes');list.replaceChildren();
 data.classes.forEach(c=>{let b=document.createElement('button');b.className='class-btn'+(current()?.id===c.id?' active':'');let n=document.createElement('span');n.textContent=c.name;let count=document.createElement('span');count.className='count';count.textContent=c.students.length;b.append(n,count);b.onclick=()=>{data.active=c.id;save();render()};list.append(b)});
 let c=current();if(c&&!Array.isArray(c.items))c.items=[];document.getElementById('classTitle').textContent=c?.name||'Cap classe';document.getElementById('classInfo').textContent=c?`${c.students.length} alumnes`:'Crea una classe per començar';['renameClass','deleteClass','addStudent','addItem'].forEach(id=>document.getElementById(id).disabled=!c);
 let area=document.getElementById('tableArea');area.replaceChildren();if(!c){area.innerHTML='<div class="empty">Encara no hi ha classes.</div>';return}
 let wrap=document.createElement('div');wrap.className='table-wrap';let table=document.createElement('table');table.innerHTML='<thead><tr><th>#</th><th>Nom i cognoms</th><th></th></tr></thead>';let headRow=table.querySelector('thead tr');
 c.items.forEach(item=>{let th=document.createElement('th');let group=document.createElement('div');group.className='item-head';let edit=document.createElement('button');edit.className='item-edit';edit.textContent=item.name+(item.type==='calculated'?' ∑':'');edit.title=item.type==='calculated'?'Editar nom i ponderacions':'Canviar el nom de l’ítem';edit.onclick=()=>{if(item.type==='calculated'){openCalculated(c,item);return}let name=prompt('Nou nom de l’ítem:',item.name);if(!name?.trim())return;item.name=name.trim();save();render()};let remove=document.createElement('button');remove.className='item-remove';remove.textContent='×';remove.title='Eliminar ítem';remove.onclick=()=>{if(!confirm(`Vols eliminar l’ítem "${item.name}" i totes les seves notes?`))return;c.items=c.items.filter(x=>x.id!==item.id);c.students.forEach(s=>{if(s.grades)delete s.grades[item.id]});save();render()};group.append(edit,remove);th.append(group);headRow.insertBefore(th,headRow.lastElementChild)});
 let body=document.createElement('tbody');c.students.forEach((s,i)=>{let tr=document.createElement('tr');let num=document.createElement('td');num.className='num';num.textContent=String(i+1).padStart(2,'0');let name=document.createElement('td');let input=document.createElement('input');input.className='name-input';input.value=s.name;input.setAttribute('aria-label','Nom de l’alumne');input.oninput=()=>{s.name=input.value;save()};name.append(input);tr.append(num,name);
 c.items.forEach(item=>{let td=document.createElement('td');if(item.type==='calculated'){let val=document.createElement('div');val.className='calculated';val.dataset.calc=item.id;val.dataset.student=s.id;td.append(val)}else{let grade=document.createElement('input');grade.className='grade-input';grade.type='text';grade.inputMode='decimal';grade.placeholder='—';grade.value=s.grades?.[item.id]??'';grade.setAttribute('aria-label',item.name+' · '+s.name);grade.oninput=()=>{(s.grades??={})[item.id]=grade.value;save();refreshCalculated(c)};td.append(grade)}tr.append(td)});
 let action=document.createElement('td');action.style.textAlign='right';let del=document.createElement('button');del.className='delete';del.textContent='×';del.title='Eliminar alumne';del.onclick=()=>{if(confirm(`Vols eliminar ${s.name||'aquest alumne'}?`)){c.students.splice(i,1);save();render()}};action.append(del);tr.append(action);body.append(tr)});table.append(body);wrap.append(table);area.append(wrap);refreshCalculated(c);
}
function openCalculated(c,item=null){
 const available=c.items.filter(x=>x.type!=='calculated');if(!available.length){alert('Primer has de crear un ítem de nota manual.');return}
 const root=document.getElementById('modalRoot');root.replaceChildren();let back=document.createElement('div');back.className='modal-back';let modal=document.createElement('div');modal.className='modal';modal.setAttribute('role','dialog');modal.setAttribute('aria-modal','true');
 let heading=document.createElement('h3');heading.textContent=item?'Editar ítem calculat':'Nou ítem calculat';let help=document.createElement('p');help.textContent='Assigna un percentatge a cada nota. El total ha de ser del 100 %.';
 let nameLabel=document.createElement('label');nameLabel.textContent='Nom de la columna';let name=document.createElement('input');name.value=item?.name||'';name.placeholder='Nota Unitat 1';
 let rows=document.createElement('div');let error=document.createElement('p');error.className='error';
 const addRow=(id='',percent='')=>{let row=document.createElement('div');row.className='weight-row';let a=document.createElement('div');let l1=document.createElement('label');l1.textContent='Ítem';let sel=document.createElement('select');let empty=document.createElement('option');empty.value='';empty.textContent='Selecciona un ítem';sel.append(empty);available.forEach(x=>{let o=document.createElement('option');o.value=x.id;o.textContent=x.name;sel.append(o)});sel.value=id;a.append(l1,sel);let b=document.createElement('div');let l2=document.createElement('label');l2.textContent='Pes (%)';let pct=document.createElement('input');pct.type='number';pct.min='0';pct.max='100';pct.step='any';pct.value=percent;b.append(l2,pct);row.append(a,b);rows.append(row)};
 if(item?.weights?.length)item.weights.forEach(w=>addRow(w.id,w.percent));else{addRow(available[0]?.id||'',85);addRow(available[1]?.id||'',15)}
 let add=document.createElement('button');add.className='secondary';add.textContent='+ Afegir ponderació';add.style.marginTop='12px';add.onclick=()=>addRow();let actions=document.createElement('div');actions.className='modal-actions';let cancel=document.createElement('button');cancel.className='secondary';cancel.textContent='Cancel·lar';const close=()=>root.replaceChildren();cancel.onclick=close;let ok=document.createElement('button');ok.className='primary';ok.textContent='Desar ítem';ok.onclick=()=>{const nameText=name.value.trim();const parts=[...rows.children].map(row=>({id:row.querySelector('select').value,percent:Number(row.querySelector('input').value)}));if(!nameText){error.textContent='Escriu un nom.';return}if(parts.some(p=>!p.id||!Number.isFinite(p.percent)||p.percent<=0)||new Set(parts.map(p=>p.id)).size!==parts.length){error.textContent='Selecciona ítems diferents i percentatges positius.';return}if(Math.abs(parts.reduce((a,p)=>a+p.percent,0)-100)>0.00001){error.textContent='Els percentatges han de sumar 100 %.';return}if(item){item.name=nameText;item.weights=parts}else c.items.push({id:uid(),name:nameText,type:'calculated',weights:parts});save();close();render()};actions.append(cancel,ok);modal.append(heading,help,nameLabel,name,rows,add,error,actions);back.append(modal);back.onclick=e=>{if(e.target===back)close()};root.append(back);name.focus();
}
document.getElementById('addItem').onclick=()=>{let c=current();if(!c)return;let type=confirm('Vols crear un ítem calculat amb percentatges?\n\nAcceptar: calculat\nCancel·lar: nota manual');if(type){openCalculated(c);return}let name=prompt('Nom del nou ítem (per exemple, Examen 1):');if(!name?.trim())return;c.items.push({id:uid(),name:name.trim()});save();render()};
document.getElementById('addClass').onclick=()=>{let name=prompt('Nom de la nova classe:');if(!name?.trim())return;let c={id:uid(),name:name.trim(),students:[],items:[]};data.classes.push(c);data.active=c.id;save();render()};
document.getElementById('renameClass').onclick=()=>{let c=current();if(!c)return;let name=prompt('Nou nom de la classe:',c.name);if(!name?.trim())return;c.name=name.trim();save();render()};
document.getElementById('deleteClass').onclick=()=>{let c=current();if(!c||!confirm(`Vols eliminar la classe "${c.name}" i tots els seus alumnes?`))return;data.classes=data.classes.filter(x=>x.id!==c.id);data.active=data.classes[0]?.id||null;save();render()};
document.getElementById('addStudent').onclick=()=>{let c=current();if(!c)return;let name=prompt('Nom i cognoms de l’alumne:');if(!name?.trim())return;c.students.push({id:uid(),name:name.trim()});save();render()};
save();render();
</script>
</body></html>
