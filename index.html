<script id="paideia-auth-script">
document.addEventListener('DOMContentLoaded', () => {
'use strict';
const BASE='https://haydjuqdnpdoxqxgbfct.supabase.co';
const KEY='sb_publishable_p8HCGod4irQ73QkNMGzT_g_EsJ-FSyH';
const form=document.getElementById('paideiaAuthForm');
const message=document.getElementById('paAuthMessage');
const submit=document.getElementById('paAuthSubmit');
let accessToken=null, profile=null, allClasses=[], currentClass=null, currentView="grades", activeEvaluation="1a", isAdmin=false;
 let teacherGroups=[];
 function classLabel(c,groups=[]){
   const group=groups.find(g=>String(g.id)===String(c.grup_id));
   const raw=String(group?.nom||'').trim();
   const letter=raw.match(/([A-Za-z])\s*$/)?.[1]?.toUpperCase();
   const course=Number(c.curs);
   const courseLabel=({1:'1er',2:'2n',3:'3er',4:'4t'})[course] || (Number.isFinite(course)&&course>0?String(course):'');
   const groupLabel=letter?courseLabel+' '+letter:(raw||courseLabel);
   return String(c.nom||'Assignatura')+(groupLabel?' · '+groupLabel:'');
 }
 function classOrder(a,b,groups){
   const course=(Number(a.curs)||0)-(Number(b.curs)||0);
   if(course)return course;
   const groupName=c=>String(groups.find(g=>String(g.id)===String(c.grup_id))?.nom||'');
   const group=groupName(a).localeCompare(groupName(b),'ca',{numeric:true,sensitivity:'base'});
   if(group)return group;
   return String(a.nom||'').localeCompare(String(b.nom||''),'ca')||String(a.id).localeCompare(String(b.id));
 }
 const EVALUATIONS=[["previa","Prèvia"],["1a","1a avaluació"],["2a","2a avaluació"],["3a","3a avaluació"],["curs","Final de curs"]];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,token=accessToken,opts={}){
 const response=await fetch(BASE+path,{...opts,headers:{apikey:KEY,...(token?{Authorization:'Bearer '+token}:{}),...(opts.headers||{})}});
 const raw=await response.text();let result;try{result=JSON.parse(raw)}catch{result=raw}
 if(!response.ok)throw Error(result?.message||result?.msg||result?.error_description||result?.error||('HTTP '+response.status));
 return result;
}

shell.innerHTML=`<header class="brand-header"><div class="brand-identity"><div class="brand-logo" style="font-size:30px">⚔️</div><div class="brand-copy"><strong>Paideia · Jedi</strong><span class="brand-subtitle">Acadèmia de proves · dades fictícies</span></div></div><div><span id="jediWho"></span><button id="jediLogout" class="secondary" style="margin-left:12px">Tancar sessió</button></div></header><main><div class="top"><div><h1>Les meves classes</h1><p class="sub">Classes, alumnat, qualificacions, assistència i incidències · dades fictícies</p></div></div><div class="layout"><aside class="panel side"><div id="jediClassList"></div><div style="margin-top:18px;padding-top:14px;border-top:1px solid #e8ebef"><div class="side-title">Horaris i calendari</div><button type="button" id="paMySchedule" class="class-btn">🗓 El meu horari</button><button type="button" id="paGroupSchedule" class="class-btn">🏫 Horari de grups classe</button><button type="button" id="paSchoolCalendar" class="class-btn">📅 Calendari escolar</button></div><div style="margin-top:18px;padding-top:14px;border-top:1px solid #e8ebef"><div class="side-title">Recursos</div><button type="button" id="paUsefulLinks" class="class-btn">🔗 Enllaços d’interès</button><button type="button" id="paComms" class="class-btn">✉ Comunicats a famílies</button></div><div id="jediAdminNav" hidden style="margin-top:18px;padding-top:14px;border-top:1px solid #e8ebef"><div class="side-title">Gestió del centre</div><button type="button" id="jediAdminButton" class="class-btn">⚙ Administració</button></div></aside><section class="panel"><div class="content-head"><div><h2 id="jediTitle">Selecciona una classe</h2><p id="jediSubtitle" class="hint"></p></div><div class="actions"><button type="button" id="jediGradesTab" class="primary">Qualificacions</button><button type="button" id="jediAttendanceTab" class="secondary">✓ Passar llista</button><button type="button" id="jediIncidentsTab" class="secondary">Incidències i reconeixements</button><button type="button" id="jediSeatsTab" class="secondary">🪑 Distribució de l’aula</button></div></div><div id="jediContent" class="empty">Selecciona una classe del menú.</div></section></div><p id="jediStatus" class="footer" role="status"></p></main>`;
document.body.append(shell);

function showLogin(err=''){document.body.classList.remove('paideia-authenticated');shell.hidden=true;accessToken=null;profile=null;isAdmin=false;$('jediAdminNav').hidden=true;message.textContent=err;submit.disabled=false}
function showApp(){document.body.classList.add('paideia-authenticated');shell.hidden=false;$('jediWho').textContent=profile.nom;}
 async function login(email,password){
  const auth=await api('/auth/v1/token?grant_type=password',null,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
  if(!auth.access_token)throw Error('No s’ha rebut una sessió vàlida.');
  const authUserId=auth.user?.id;
  if(!authUserId)throw Error('No s’ha pogut identificar l’usuari autenticat.');
  // Comprovem els permisos d'administració independentment del perfil docent.
  // El servidor (RLS) és qui determina l'accés real a les dades.
  let adminVerified=false;
  try{
   adminVerified=(await api('/rest/v1/rpc/es_administrador',auth.access_token,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}))===true;
  }catch(err){console.warn('No s’ha pogut verificar el rol administrador:',err)}
  const p=await api('/rest/v1/professors?select=id,nom&auth_user_id=eq.'+encodeURIComponent(authUserId)+'&limit=1',auth.access_token);
  const teacher=Array.isArray(p)&&p.length===1?p[0]:null;
  if(!teacher&&!adminVerified)throw Error('Aquest usuari no té un perfil de professor ni un rol d’administrador autoritzat.');
  accessToken=auth.access_token;
  isAdmin=adminVerified;
  profile=teacher||{id:null,nom:'Administració'};
  $('jediAdminNav').hidden=!isAdmin;
  $('paMySchedule').textContent=isAdmin?'🗓 Horaris del professorat':'🗓 El meu horari';
  showApp();
  if(teacher){
   await loadClasses();
  }else{
   allClasses=[];currentClass=null;
   $('jediClassList').replaceChildren();
   $('jediContent').textContent='Selecciona Administració per consultar les dades del centre.';
   status('Accés d’administració verificat.');
  }
  // Un administrador sense assignatures entra directament al seu panell.
  if(isAdmin&&!allClasses.length)$('jediAdminButton').click();
 }

 async function loadClasses(){
  status('Carregant classes…');
  // La consulta a professors_classes està filtrada per RLS segons la sessió.
  const [links,classes,groups]=await Promise.all([
   api('/rest/v1/professors_classes?select=professor_id,classe_id&limit=1000'),
   api('/rest/v1/classes?select=id,nom,curs,grup_id,es_optativa,tipus_assignatura&limit=1000'),
    api('/rest/v1/grups?select=id,nom&limit=1000')
  ]);
  teacherGroups=groups;
  const mine=new Set(links.filter(x=>x.professor_id===profile.id).map(x=>x.classe_id));
  allClasses=classes.filter(c=>mine.has(c.id)).sort((a,b)=>classOrder(a,b,teacherGroups));
  $('jediClassList').replaceChildren();
  for(const c of allClasses){const b=document.createElement('button');b.className='class-btn';b.textContent=classLabel(c,teacherGroups);b.dataset.id=c.id;b.onclick=()=>{activeEvaluation='1a';showClass(c)};$('jediClassList').append(b)}
  status(allClasses.length+' classes visibles segons els permisos RLS.');
  if(allClasses.length)await showClass(allClasses[0]);
  else $('jediContent').textContent='Aquest usuari no té classes assignades.';
 }

// Horaris compartits: les dades i els permisos depenen de Supabase (RLS).
const paDays=['Dilluns','Dimarts','Dimecres','Dijous','Divendres'];
let paScheduleRequest=0;
// Manté el docent o grup seleccionat quan es desa i es torna a dibuixar el calendari.
const paScheduleSelection={teacher:null,group:null};
function paScheduleLayout(title,subtitle){
 $('paUsefulLinks').classList.remove('active');$('paComms').classList.remove('active');
 currentClass=null;currentView='schedule';
 $('jediTitle').textContent=title;$('jediSubtitle').textContent=subtitle;
 for(const id of ['jediGradesTab','jediAttendanceTab','jediIncidentsTab','jediSeatsTab'])$(id).hidden=true;

}

function paSelect(options,value){const e=document.createElement('select');e.style.cssText='padding:8px;border:1px solid #cbd5e1;border-radius:8px;max-width:100%';for(const [v,t] of options){const o=new Option(t,String(v));e.add(o)}e.value=String(value??'');return e;}
async function paGetScheduleData(){
 const [slots,sessions,teachers,groups,classes]=await Promise.all([
  api('/rest/v1/franjes_horaries?select=*&order=ordre.asc'),
  api('/rest/v1/sessions_horari?select=*&limit=3000'),
  api('/rest/v1/professors?select=id,nom&limit=1000'),
  api('/rest/v1/grups?select=id,nom&limit=1000'),
  api('/rest/v1/classes?select=id,nom,curs,grup_id,tipus_assignatura&limit=1000')
 ]);
 const links=await api('/rest/v1/sessions_horari_professors?select=sessio_id,professor_id&limit=5000');
 return {slots,sessions,teachers,groups,classes,links};
}
async function paShowSchedule(mode){
 const request=++paScheduleRequest;
 const root=paScheduleLayout(mode==='teacher'?(isAdmin?'🗓 Horaris del professorat':'🗓 El meu horari'):'🏫 Horaris dels grups classe',isAdmin?'Consulta i edició · administració':'Consulta · només lectura');
 root.append(paEl('p','Carregant horaris de Supabase…','note-hint'));
 try{
  const data=await paGetScheduleData();if(request!==paScheduleRequest)return;
  root.replaceChildren();
  const bar=paEl('div');bar.style.cssText='display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin:14px 20px';
  const people=mode==='teacher'?data.teachers:data.groups;
  const choices=people.map(x=>[x.id,x.nom]).sort((a,b)=>a[1].localeCompare(b[1],'ca',{numeric:true}));
  if(!choices.length){root.append(paEl('p','No hi ha registres visibles per consultar.','note-hint'));return}
  const preferred=paScheduleSelection[mode]||(mode==='teacher'&&profile?.id?String(profile.id):null);
  const selected=choices.some(([id])=>String(id)===String(preferred))?preferred:choices[0][0];
  const selector=paSelect(choices,selected);
  paScheduleSelection[mode]=selector.value;
  if(mode!=='teacher'||isAdmin){const label=paEl('label',mode==='teacher'?'Professor/a':'Grup classe');label.style.cssText='display:grid;gap:5px;font-weight:600';label.append(selector);bar.append(label);}
  if(isAdmin){const editSlots=paEl('button','⚙ Modificar franges','secondary');editSlots.onclick=()=>paEditSlots(data,()=>paShowSchedule(mode));bar.append(editSlots)}
  root.append(bar);
  const grid=paEl('div');grid.style.cssText='overflow-x:auto;margin:0 20px 24px';root.append(grid);
  const draw=()=>{
   grid.replaceChildren();const table=paEl('table');table.style.cssText='border-collapse:collapse;width:100%;min-width:690px;table-layout:fixed';
   const tr=paEl('tr');for(const head of ['Hora',...paDays]){const th=paEl('th',head);th.style.cssText='padding:12px;border:1px solid #dce3ed;background:#eef2f7';tr.append(th)}table.append(tr);
   for(const slot of data.slots){
    const row=paEl('tr');const time=paEl('th',slot.nom+'\n'+String(slot.inici).slice(0,5)+'–'+String(slot.fi).slice(0,5));time.style.cssText='white-space:pre-line;font-size:12px;padding:10px;border:1px solid #dce3ed;background:#f8fafc';row.append(time);
    for(let day=1;day<=5;day++){
     const td=paEl('td');td.style.cssText='padding:9px;border:1px solid #dce3ed;text-align:center;vertical-align:middle;min-height:55px;white-space:pre-line';
     if(slot.tipus!=='classe'){td.textContent=slot.tipus==='pati'?'☕ PATI':'🍽 DINAR';td.style.background='#e8f3e9';}
     else{
      const matching=data.sessions.filter(x=>x.dia===day&&x.franja_id===slot.id&&(mode==='teacher'?(String(x.professor_id)===selector.value||data.links.some(l=>String(l.sessio_id)===String(x.id)&&String(l.professor_id)===selector.value)):String(x.grup_id)===selector.value));
      const record=matching[0];
      const clazz=data.classes.find(x=>x.id===record?.classe_id);
      const teacherNames=record?data.links.filter(l=>String(l.sessio_id)===String(record.id)).map(l=>data.teachers.find(t=>String(t.id)===String(l.professor_id))?.nom).filter(Boolean):[];
      const group=data.groups.find(x=>x.id===record?.grup_id);
      const yearName=({1:'1r ESO',2:'2n ESO',3:'3r ESO',4:'4t ESO'})[clazz?.curs]||'';const courseLabel=clazz?(clazz.tipus_assignatura==='acollida'?'Tots els cursos':(clazz.grup_id&&!['optativa','optativa_rotativa','optativa_eleccio'].includes(clazz.tipus_assignatura))?(data.groups.find(g=>String(g.id)===String(clazz.grup_id))?.nom||group?.nom||yearName):yearName):'';td.textContent=record?[(clazz?.nom||record.etiqueta||'Sessió')+(courseLabel?' · '+courseLabel:''),mode==='teacher'?(group?.nom&&group.nom!==courseLabel?group.nom:''):(teacherNames.join(' · ')||'')].filter(Boolean).join('\n'): '—';
      if(record)td.style.background='#e8f1ff';
      if(isAdmin){td.style.cursor='pointer';td.title='Clica per editar aquesta sessió';td.onclick=()=>paEditSession(data,mode,selector.value,day,slot,record,()=>paShowSchedule(mode))}
     }row.append(td)
    }table.append(row)
   }grid.append(table)
  };selector.onchange=()=>{paScheduleSelection[mode]=selector.value;draw()};draw();
  root.append(paEl('p',isAdmin?'Clica una casella lectiva per crear, modificar o eliminar una sessió. Els canvis es reflecteixen als dos horaris.':'Els horaris són de consulta. Només administració pot modificar-los.','note-hint'));
 }catch(err){root.replaceChildren(paEl('p','No s’han pogut carregar els horaris. Executa primer la migració SQL. Detall: '+err.message,'note-hint'))}

function paModal(title){const shade=paEl('div');shade.style.cssText='position:fixed;inset:0;background:#0f172a99;z-index:99999;display:grid;place-items:center;padding:20px';const box=paEl('div');box.style.cssText='background:white;padding:25px;border-radius:14px;max-width:550px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 50px #0003';box.append(paEl('h2',title));shade.append(box);document.body.append(shade);shade.onclick=e=>{if(e.target===shade)shade.remove()};return {shade,box}}

function paEditSession(data,mode,id,day,slot,record,refresh){
 const {shade,box}=paModal(paDays[day-1]+' · '+slot.nom);
 // Primer els grups fixos (1r A, 1r B, ...), després les optatives sense grup.
 // Les etiquetes es calculen per visualitzar-les: no es modifica cap registre de Supabase.
 const groupOf=c=>data.groups.find(g=>String(g.id)===String(c.grup_id));
 const courseOf=c=>Number(c.curs)||Number(String(groupOf(c)?.nom||'').match(/[1-4]/)?.[0])||99;
 const letterOf=c=>String(groupOf(c)?.nom||'').match(/\b([AB])\s*$/i)?.[1]?.toUpperCase()||'';
 const groupRank=c=>letterOf(c)==='A'?0:letterOf(c)==='B'?1:2;
 const isGrouped=c=>Boolean(letterOf(c));
 const classLabelForSchedule=c=>{
  const course=courseOf(c), prefix=({1:'1r ESO',2:'2n ESO',3:'3r ESO',4:'4t ESO'})[course]||'Curs no definit';
  const suffix=isGrouped(c)?prefix+' '+letterOf(c):prefix;
  return String(c.nom||'Assignatura')+' · '+suffix;
 };

async function paMoveLink(link,dir,links,refresh){

 const ordered=[...links].sort((a,b)=>(Number(a.ordre)||0)-(Number(b.ordre)||0)||String(a.nom).localeCompare(String(b.nom),'ca'));
 const i=ordered.findIndex(x=>x.id===link.id),j=i+dir;
 if(i<0||j<0||j>=ordered.length)return;
 // Actualitzem amb ordres consecutius per evitar empats en la següent consulta.
 [ordered[i],ordered[j]]=[ordered[j],ordered[i]];
 try{
  for(let k=0;k<ordered.length;k++){
   if(Number(ordered[k].ordre)!==k+1)await api('/rest/v1/enllacos_interes?id=eq.'+encodeURIComponent(ordered[k].id),accessToken,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({ordre:k+1})});
  }
  await refresh();
 }catch(e){alert('No s’ha pogut reordenar: '+e.message);await refresh()}
}

const jediCloudHierarchy=new Map();
const jediHierarchyKey=(c,e)=>String(profile.id)+':'+String(c.id)+':'+e;

async function jediSaveHierarchy(c,e,model){

function openHierarchyConfigurator(classe,evaluation,availableItems=[]){
 const manualColumns=availableItems.filter(x=>x.tipus==='manual');
 const columnById=new Map(manualColumns.map(x=>[String(x.id),x]));
 const storageKey='paideia-hierarchy-prototype:'+profile.id+':'+classe.id+':'+evaluation;
 const defaults=[{name:'Unitat 1',weight:100,categories:[]}];
 let model;
 try{model=jediCloudHierarchy.get(jediHierarchyKey(classe,evaluation))||JSON.parse(localStorage.getItem(storageKey))||defaults}catch(_){model=defaults}
 if(!Array.isArray(model))model=defaults;
 // Les versions anteriors desaven noms lliures: no s'enllacen per nom per evitar errors.
 model.forEach(u=>(u.categories||[]).forEach(c=>(c.items||[]).forEach(i=>{if(!i.columnId)i.columnId=null}))); 
 const overlay=document.createElement('div');overlay.className='jedi-config-overlay';
 const modal=document.createElement('section');modal.className='jedi-config-modal';modal.setAttribute('role','dialog');modal.setAttribute('aria-modal','true');modal.setAttribute('aria-label','Configurar ponderacions');overlay.append(modal);

 const sum=xs=>xs.reduce((a,x)=>a+(Number(x.weight)||0),0);
 const fmt=n=>Number(n.toFixed(2)).toLocaleString('ca-ES');
 function redistribute(xs){if(!xs.length)return;const n=xs.length;let used=0;xs.forEach((x,i)=>{const v=i===n-1?100-used:Math.round(10000/n)/100;x.weight=Number(v.toFixed(2));used+=x.weight})}
 let feedback;
 function updateFeedback(){
  if(!feedback)return;
  const incomplete=[],errors=[];
  function check(xs,label){
   if(!xs.length){incomplete.push('Afegeix '+label);return}
   if(xs.some(x=>!Number.isFinite(Number(x.weight))||Number(x.weight)<0||Number(x.weight)>100)){
    errors.push('Hi ha pesos invàlids a '+label);return;
   }
   const total=sum(xs);
   if(Math.abs(total-100)>0.011){
    const delta=100-total;
    errors.push(label+': '+fmt(total)+' % ('+(delta>0?'falten '+fmt(delta):'sobren '+fmt(-delta))+' %)');
   }
  }
  check(model,'les unitats');
  model.forEach(u=>{check(u.categories,'les categories de «'+u.name+'»');u.categories.forEach(c=>{check(c.items,'els ítems de «'+c.name+'»');for(const item of c.items){if(!item.columnId)incomplete.push('Selecciona una columna per a «'+c.name+'»');else if(!columnById.has(String(item.columnId)))errors.push('Columna eliminada o no disponible a «'+c.name+'»');}const ids=c.items.map(i=>i.columnId).filter(Boolean);if(new Set(ids).size!==ids.length)errors.push('Hi ha columnes repetides a «'+c.name+'»')})});
  feedback.className='jedi-config-warning '+(errors.length?'jedi-config-error':incomplete.length?'jedi-config-incomplete':'jedi-config-ok');
  feedback.textContent=errors.length?'⚠ '+errors.join(' · '):incomplete.length?'◌ Configuració en curs: '+incomplete.join(' · '):'✓ Configuració completa: tots els pesos sumen 100 %.';
 }
 const input=(value,change,type='text',cls='')=>{const i=el('input',cls);i.type=type;i.value=value;
  if(type==='number'){i.min='0';i.max='100';i.step='0.01';i.inputMode='decimal'}
  i.addEventListener('input',()=>{change(type==='number'?(i.value===''?NaN:Number(i.value)):i.value);updateFeedback()});
  return i;
 };
 function render(){

  if(!manualColumns.length)modal.append(el('p','jedi-config-warning jedi-config-incomplete','Encara no hi ha columnes manuals en aquesta avaluació. Tanca aquest panell i crea-les amb «+ Concepte manual».')); 
  model.forEach((unit,ui)=>{
   const box=el('div','jedi-config-unit');const row=el('div','jedi-config-row');row.append(el('strong','jedi-config-badge','UNITAT'),input(unit.name,v=>unit.name=v,'text','jedi-config-name'),el('span','','Pes'),input(unit.weight,v=>unit.weight=v,'number','jedi-config-weight'),el('span','','%'),btn('Eliminar',()=>{if(confirm('Eliminar aquesta unitat del prototip?')){model.splice(ui,1);render()}}));box.append(row);
   unit.categories.forEach((cat,ci)=>{
    const catbox=el('div','jedi-config-cat');const catrow=el('div','jedi-config-row');catrow.append(el('span','jedi-config-badge','Categoria'),input(cat.name,v=>cat.name=v,'text','jedi-config-name'),el('span','','Pes'),input(cat.weight,v=>cat.weight=v,'number','jedi-config-weight'),el('span','','%'),btn('Eliminar',()=>{unit.categories.splice(ci,1);render()}));catbox.append(catrow);
    cat.items.forEach((item,ii)=>{const itemrow=el('div','jedi-config-row jedi-config-item');
     const select=el('select','jedi-config-name');select.setAttribute('aria-label','Columna de qualificacions');

     select.onchange=()=>{item.columnId=select.value||null;item.name=columnById.get(select.value)?.nom||'';updateFeedback()};
     itemrow.append(el('span','jedi-config-badge','Columna'),select,el('span','','Pes'),input(item.weight,v=>item.weight=v,'number','jedi-config-weight'),el('span','','%'),btn('✕',()=>{cat.items.splice(ii,1);render()}));catbox.append(itemrow)});
    const actions=el('div','jedi-config-actions');actions.append(btn('+ Afegir ítem',()=>{cat.items.push({name:'',columnId:null,weight:0});redistribute(cat.items);render()}),btn('↔ Repartir pesos',()=>{redistribute(cat.items);render()}));catbox.append(actions);
    box.append(catbox);
   });
   const actions=el('div','jedi-config-actions');actions.append(btn('+ Afegir categoria',()=>{unit.categories.push({name:'Nova categoria',weight:0,items:[{name:'',columnId:null,weight:100}]});redistribute(unit.categories);render()}),btn('↔ Repartir categories',()=>{redistribute(unit.categories);render()}));box.append(actions);
   modal.append(box);
  });
  const actions=el('div','jedi-config-actions');actions.append(btn('+ Afegir unitat',()=>{model.push({name:'Unitat '+(model.length+1),weight:0,categories:[]});redistribute(model);render()},'primary'),btn('↔ Repartir unitats',()=>{redistribute(model);render()}));modal.append(actions);
  const foot=el('div','jedi-config-footer');feedback=el('div','jedi-config-warning');foot.append(feedback,btn('☁ Desar a Supabase',async()=>{

   catch(err){saveButton.disabled=false;alert('No s’han pogut desar les ponderacions: '+err.message)}
  },'primary'));modal.append(foot);
  updateFeedback();modal.scrollTop=scroll;
 }
 overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove()});document.addEventListener('keydown',function esc(e){if(e.key==='Escape'){overlay.remove();document.removeEventListener('keydown',esc)}});
 document.getElementById('jediShell').append(overlay);render();
}

// Càlcul jeràrquic local, de només lectura: mai no modifica Supabase.
function jediHierarchyResults(classe,evaluation,items,students,gradeMap){
 const key='paideia-hierarchy-prototype:'+profile.id+':'+classe.id+':'+evaluation;
 let units;try{units=jediCloudHierarchy.get(jediHierarchyKey(classe,evaluation))||JSON.parse(localStorage.getItem(key))}catch(_){return null}
 if(!Array.isArray(units)||!units.length)return null;
 const validWeight=x=>Number.isFinite(Number(x?.weight))&&Number(x.weight)>=0&&Number(x.weight)<=100;
 const validGroup=xs=>Array.isArray(xs)&&xs.length>0&&xs.every(validWeight)&&Math.abs(xs.reduce((t,x)=>t+Number(x.weight),0)-100)<0.015;
 const ids=new Set(items.filter(x=>x.tipus==='manual').map(x=>String(x.id)));
 const valid=validGroup(units)&&units.every(u=>validGroup(u.categories)&&u.categories.every(c=>validGroup(c.items)&&c.items.every(i=>i.columnId&&ids.has(String(i.columnId)))&&new Set(c.items.map(i=>String(i.columnId))).size===c.items.length));
 const gradeFor=(student,id)=>{const g=gradeMap.get(student.id+'|'+id);if(!g||g.nota===null||g.nota===undefined||g.nota==='')return null;const n=Number(g.nota);return Number.isFinite(n)?n:null};
 const weighted=(xs,fn)=>{let total=0;for(const x of xs){const value=fn(x);if(value===null)return null;total+=value*Number(x.weight)/100}return total};
 const result=(student,unit)=>weighted(unit.categories,c=>weighted(c.items,i=>gradeFor(student,i.columnId)));
 return {units,valid,unitResult:result,evaluationResult:student=>weighted(units,u=>result(student,u))};
}
function jediHierarchyCell(value){
 const cell=document.createElement('td');cell.className='jedi-hierarchy-result';
 if(value===null){const pending=document.createElement('span');pending.className='jedi-pending';pending.textContent='— Pendent';cell.append(pending)}
 else{const badge=document.createElement('span');badge.className='jedi-calc '+(value<5?'grade-fail':'grade-pass');badge.textContent=value.toLocaleString('ca-ES',{minimumFractionDigits:2,maximumFractionDigits:2});cell.append(badge)}
 return cell;
}
// Notes finals persistents: els ajustos manuals mai no són sobreescrits pels càlculs.
async function jediSaveFinal(classe,student,evaluation,calculated,existing){
 if(!profile?.id)throw Error('No hi ha professor autenticat.');
 const current=existing?.nota_manual;
 const initial=current===null||current===undefined?(calculated===null?'':String(Number(calculated.toFixed(2)))):String(current);
 const response=prompt('Nota final de '+student.nom+' '+student.cognoms+' (0–10).\nDeixa el camp buit per recuperar el càlcul automàtic.',initial);
 if(response===null)return false;
 const clean=response.trim().replace(',','.');
 if(clean!==''&&(!Number.isFinite(Number(clean))||Number(clean)<0||Number(clean)>10)){
  alert('Introdueix una nota entre 0 i 10, o deixa-la en blanc per restablir el càlcul.');return false;
 }
 const manual=clean===''?null:Number(clean);
 if(manual===null&&calculated===null){
  if(existing){await api('/rest/v1/notes_finals_avaluacio?classe_id=eq.'+encodeURIComponent(classe.id)+'&alumne_id=eq.'+encodeURIComponent(student.id)+'&avaluacio=eq.'+encodeURIComponent(evaluation),accessToken,{method:'DELETE'});}
  return true;
 }
 const payload={classe_id:classe.id,alumne_id:student.id,avaluacio:evaluation,professor_id:profile.id,
  nota_calculada:calculated===null?null:Number(calculated.toFixed(4)),nota_manual:manual};
 await api('/rest/v1/notes_finals_avaluacio?on_conflict=classe_id,alumne_id,avaluacio',accessToken,{method:'POST',headers:{'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(payload)});

// Sincronització automàtica: només escriu quan el càlcul ha canviat.
// Els ajustos manuals es preserven amb PATCH de nota_calculada.
async function jediAutoSync(classe,evaluation,students,calculate,existing,course=false){
 const table=course?'notes_finals_curs':'notes_finals_avaluacio';
 const updates=[],inserts=[];
 for(const student of students){
  const value=calculate(student);
  if(value===null||!Number.isFinite(value))continue;
  const next=Number(value.toFixed(4)),old=existing.get(String(student.id));
  if(old?.nota_calculada!==null&&old?.nota_calculada!==undefined&&Math.abs(Number(old.nota_calculada)-next)<0.00005)continue;
  if(old?.nota_manual!==null&&old?.nota_manual!==undefined){
   updates.push({student,nota:next});
  }else inserts.push({classe_id:classe.id,alumne_id:student.id,professor_id:profile.id,nota_calculada:next,nota_manual:null,...(course?{}:{avaluacio:evaluation})});
 }
 if(inserts.length)await api('/rest/v1/'+table+'?on_conflict='+(course?'classe_id,alumne_id':'classe_id,alumne_id,avaluacio'),accessToken,{method:'POST',headers:{'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(inserts)});
 for(const {student,nota} of updates){
  await api('/rest/v1/'+table+'?classe_id=eq.'+encodeURIComponent(classe.id)+'&alumne_id=eq.'+encodeURIComponent(student.id)+(course?'':'&avaluacio=eq.'+encodeURIComponent(evaluation)),accessToken,{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({nota_calculada:nota})});
 }
 return inserts.length+updates.length;
}

// Estadístiques: valors buits exclosos, zero explícit inclòs.
function jediOpenStatistics({list,evaluationItems,gradeMap,calculations,hierarchy,finalMap}){
 const overlay=document.createElement('div');overlay.className='modal-back';
 const modal=document.createElement('div');modal.className='modal';modal.style.width='min(900px,96vw)';
 const title=document.createElement('h3');title.textContent='📊 Estadístiques · '+(EVALUATIONS.find(e=>e[0]===activeEvaluation)?.[1]||activeEvaluation);
 const select=document.createElement('select');select.style.cssText='width:100%;padding:10px;border:1px solid #dce2eb;border-radius:8px';
 for(const [value,label] of [['final','Nota final de l’avaluació'],...evaluationItems.map(i=>[i.id,i.nom])]){const option=new Option(label,value);select.add(option)}
 const width=document.createElement('select');width.style.cssText=select.style.cssText;
 for(const w of [1,2,0.5])width.add(new Option('Intervals de '+String(w).replace('.',',')+' punts',w));
 const output=document.createElement('div');
 const close=document.createElement('button');close.className='secondary';close.textContent='Tancar';close.onclick=()=>overlay.remove();
 function valid(v){return v!==null&&v!==undefined&&v!==''&&Number.isFinite(Number(v))&&Number(v)>=0&&Number(v)<=10}
 function render(){
  const selected=evaluationItems.find(i=>String(i.id)===select.value);
  const values=list.map(st=>{
   if(select.value==='final'){
    const saved=finalMap.get(String(st.id));
    if(valid(saved?.nota_manual))return Number(saved.nota_manual);
    const calculated=hierarchy?.valid?hierarchy.evaluationResult(st):null;
    return valid(calculated)?Number(calculated):valid(saved?.nota_calculada)?Number(saved.nota_calculada):null;
   }
   const key=st.id+'|'+selected.id;
   const v=selected.tipus==='manual'?gradeMap.get(key)?.nota:calculations.get(key);
   return valid(v)?Number(v):null;
  }).filter(valid).sort((a,b)=>a-b);
  const n=values.length,fmt=x=>Number(x).toLocaleString('ca-ES',{maximumFractionDigits:2});
  output.replaceChildren();
  if(!n){output.textContent='Encara no hi ha notes qualificades per analitzar.';return}
  const sum=values.reduce((a,b)=>a+b,0),mean=sum/n;
  const variance=values.reduce((a,b)=>a+(b-mean)**2,0)/n,sd=Math.sqrt(variance);
  const freq=new Map();values.forEach(v=>freq.set(v,(freq.get(v)||0)+1));
  const maxFreq=Math.max(...freq.values());const modes=[...freq].filter(([_,f])=>f===maxFreq).map(([v])=>v);
  const median=n%2?values[(n-1)/2]:(values[n/2-1]+values[n/2])/2;
  const passed=values.filter(v=>v>=5).length;
  const tiles=[['Alumnes qualificats',n+' / '+list.length],['Mitjana',fmt(mean)],['Mediana',fmt(median)],['Moda',maxFreq===1?'Sense moda':modes.map(fmt).join(', ')],['Desviació típica (σ)',fmt(sd)],['Coeficient de variació',mean===0?'—':fmt(sd/mean*100)+' %'],['Aprovats',passed+' ('+fmt(passed/n*100)+' %)'],['Suspesos',n-passed+' ('+fmt((n-passed)/n*100)+' %)'],['Mínim / màxim',fmt(values[0])+' / '+fmt(values[n-1])]];
  const grid=document.createElement('div');grid.className='stats-grid';grid.style.gridTemplateColumns='repeat(auto-fit,minmax(150px,1fr))';
  tiles.forEach(([label,v])=>{const tile=document.createElement('div');tile.className='stats-tile';const caption=document.createElement('span');caption.textContent=label;const strong=document.createElement('strong');strong.textContent=v;tile.append(caption,strong);grid.append(tile)});output.append(grid);
  const note=document.createElement('p');note.className='note-hint';note.textContent='Les notes pendents no compten; un 0 introduït sí. Desviació típica poblacional. '+(n<list.length?'Estadístiques provisionals: hi ha notes pendents.':'');output.append(note);
  const step=Number(width.value);const bars=[];for(let low=0;low<10-1e-8;low+=step){const high=Math.min(10,low+step);bars.push({label:fmt(low)+'–'+fmt(high),count:values.filter(v=>v>=low&&(high===10?v<=10:v<high)).length})}
  const maximum=Math.max(1,...bars.map(b=>b.count));const chart=document.createElement('div');chart.className='jedi-stats-chart';
  bars.forEach(b=>{const row=document.createElement('div');row.className='jedi-stats-row';const label=document.createElement('span');label.textContent=b.label;const track=document.createElement('div');track.className='jedi-stats-track';const bar=document.createElement('div');bar.className='jedi-stats-bar';bar.style.width=(b.count/maximum*100)+'%';track.append(bar);const count=document.createElement('strong');count.textContent=b.count;row.append(label,track,count);chart.append(row)});output.append(chart);
 }
 select.onchange=render;width.onchange=render;
 const labels=document.createElement('div');labels.style.cssText='display:grid;grid-template-columns:2fr 1fr;gap:12px;margin:14px 0';labels.append(select,width);
 const actions=document.createElement('div');actions.className='modal-actions';actions.append(close);modal.append(title,labels,output,actions);overlay.append(modal);overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove()});document.body.append(overlay);render();
}

 let desks=[],students=[],canEdit=false,saveTimer=null,revision=0,loaded=false;

 try{

   api('/rest/v1/distribucions_aula?select=id,taules,updated_at&tipus=eq.'+scope+'&referencia_id=eq.'+encodeURIComponent(scopeId)+'&limit=1'),

  canEdit=isAdmin||Boolean(profile?.id&&tutors.some(t=>String(t.professor_id)===String(profile.id)))||Boolean(isSpecial&&profile?.id&&allClasses.some(x=>String(x.id)===String(c.id)));
  // Per a optatives, la RLS valida al servidor que el docent està assignat a l'assignatura.

        const caution=document.createElement('p');caution.textContent='L’acceptació pel servei no garanteix el lliurament final. Consulta el registre de notificacions abans de tornar a enviar.';caution.style.cssText='font-size:12px;color:#8792a4;line-height:1.5;margin:0 0 22px';
        const ok=document.createElement('button');ok.type='button';ok.className='primary';ok.textContent='D’acord';ok.style.cssText='min-width:135px;padding:11px 18px';
        ok.onclick=()=>backdrop.remove();dialog.append(symbol,title,desc,counts,caution,ok);backdrop.append(dialog);document.body.append(backdrop);ok.focus();
        notify.textContent='Notificació sol·licitada';

// Formulari de creació/edició compartit entre els docents assignats (requereix RLS de codocència).

 if(activeEvaluation==='1a' || (grade && !grade.item_id)){const blank=document.createElement('option');blank.value='';blank.textContent='— Concepte lliure (antic sistema) —';concept.append(blank)}
 for(const item of manual){const o=document.createElement('option');o.value=item.id;o.textContent=item.nom;concept.append(o)}
 concept.value=selectedItem?.id||grade?.item_id||concept.options[0]?.value||'';
 const legacyLabel=document.createElement('label');legacyLabel.textContent='Nom del concepte lliure';
 const legacy=document.createElement('input');legacy.type='text';legacy.maxLength=200;legacy.value=grade?.concepte||'';legacy.placeholder='Ex.: Primer treball';
 const updateLegacy=()=>{legacyLabel.hidden=legacy.hidden=Boolean(concept.value)};
 concept.addEventListener('change',updateLegacy);updateLegacy();
 const gradeLabel=document.createElement('label');gradeLabel.textContent='Nota (de 0 a 10)';
 const note=document.createElement('input');note.type='number';note.min='0';note.max='10';note.step='0.01';note.required=true;note.value=grade?.nota??'';
 const error=document.createElement('p');error.className='error';error.setAttribute('role','alert');
 const actions=document.createElement('div');actions.className='modal-actions';
 const cancel=document.createElement('button');cancel.type='button';cancel.className='secondary';cancel.textContent='Cancel·lar';cancel.onclick=()=>overlay.remove();
 const save=document.createElement('button');save.type='submit';save.className='primary';save.textContent='Desar a Supabase';
 const nextIndex=students.findIndex(s=>s.id===student.id);const nextStudent=nextIndex>=0?students[nextIndex+1]:null;
 const saveNext=document.createElement('button');saveNext.type='button';saveNext.className='secondary';saveNext.textContent='Desar i següent alumne';saveNext.disabled=!nextStudent;saveNext.title=nextStudent?'Desar i obrir '+nextStudent.nom:'Últim alumne de la llista';

 actions.append(cancel,save,saveNext);card.append(title,info,conceptLabel,concept,legacyLabel,legacy,gradeLabel,note,error,actions);overlay.append(card);shell.append(overlay);
 overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove()});note.focus();
 card.addEventListener('submit',async e=>{
  e.preventDefault();error.textContent='';const val=Number(note.value);

  if(!text){error.textContent='Cal indicar un concepte.';return}

  const goNext=advance;save.disabled=true;saveNext.disabled=true;cancel.disabled=true;save.textContent='Desant…';
  try{

   const result=await api(path,accessToken,{method:grade?'PATCH':'POST',headers:{'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify(payload)});
   if(!Array.isArray(result)||result.length!==1)throw Error('No s’ha confirmat el desament. Comprova els permisos RLS.');
   overlay.remove();await showClass(classe);status('✓ Qualificació desada a Supabase · '+student.nom);
   if(goNext&&nextStudent&&currentClass?.id===classe.id&&currentView==='grades')openGradeEditor({student:nextStudent,classe,selectedItem,items,students});
  }catch(err){error.textContent='No s’ha pogut desar: '+err.message}
  finally{save.disabled=false;saveNext.disabled=!nextStudent;cancel.disabled=false;save.textContent='Desar a Supabase'}
 });
}

// Copia múltiple atòmica gestionada per la funció SQL del professor autenticat.
function openCopyItemsEditor({classe,items,weights}){
 if(!profile||!accessToken||currentClass?.id!==classe.id||!items.length)return;
 const sourceEvaluation=activeEvaluation;
 const overlay=document.createElement('div');overlay.className='modal-back';
 const card=document.createElement('form');card.className='modal jedi-copy-modal';
 const title=document.createElement('h3');title.textContent='Copiar columnes';
 const subtitle=document.createElement('p');subtitle.textContent=classe.nom+' · Origen: '+EVALUATIONS.find(x=>x[0]===sourceEvaluation)[1];
 const hint=document.createElement('p');hint.textContent='Selecciona les columnes que vols copiar. Les calculades necessiten totes les columnes de la seva fórmula.';
 const allLine=document.createElement('label');allLine.className='jedi-copy-all';
 const allBox=document.createElement('input');allBox.type='checkbox';
 allLine.append(allBox,document.createTextNode(' Seleccionar totes les columnes'));
 const choices=document.createElement('div');choices.className='jedi-copy-choices';
 const checkboxes=new Map();
 for(const item of items){
  const line=document.createElement('label');line.className='jedi-copy-choice';
  const checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.value=item.id;
  checkboxes.set(item.id,checkbox);
  const label=document.createElement('span');label.textContent=item.nom+(item.tipus==='calculada'?' ∑ (calculada)':'');
  line.append(checkbox,label);choices.append(line);
  checkbox.addEventListener('change',()=>{allBox.checked=items.every(i=>checkboxes.get(i.id).checked)});
 }
 allBox.onchange=()=>{for(const checkbox of checkboxes.values())checkbox.checked=allBox.checked};
 const destinationLabel=document.createElement('label');destinationLabel.textContent='Avaluació de destí';
 const destination=document.createElement('select');
 for(const [key,label] of EVALUATIONS){if(key===sourceEvaluation)continue;const option=document.createElement('option');option.value=key;option.textContent=label;destination.append(option)}
 const gradesLine=document.createElement('label');gradesLine.className='jedi-copy-all';
 const gradesBox=document.createElement('input');gradesBox.type='checkbox';
 gradesLine.append(gradesBox,document.createTextNode(' Copiar també les qualificacions dels alumnes'));
 const caution=document.createElement('p');caution.className='note-hint';
 caution.textContent='Les columnes originals no es modificaran. La còpia crearà columnes noves, encara que al destí ja existeixin noms iguals.';
 const error=document.createElement('p');error.className='error';error.setAttribute('role','alert');
 const actions=document.createElement('div');actions.className='modal-actions';
 const cancel=document.createElement('button');cancel.type='button';cancel.className='secondary';cancel.textContent='Cancel·lar';cancel.onclick=()=>overlay.remove();
 const save=document.createElement('button');save.type='submit';save.className='primary';save.textContent='Copiar columnes';
 actions.append(cancel,save);
 card.append(title,subtitle,hint,allLine,choices,destinationLabel,destination,gradesLine,caution,error,actions);
 overlay.append(card);shell.append(overlay);
 overlay.addEventListener('click',e=>{if(e.target===overlay&&!save.disabled)overlay.remove()});
 card.onsubmit=async e=>{
  e.preventDefault();error.textContent='';
  const selected=items.filter(item=>checkboxes.get(item.id).checked);
  if(!selected.length){error.textContent='Selecciona almenys una columna.';return}
  const selectedIds=new Set(selected.map(x=>x.id));
  for(const item of selected.filter(x=>x.tipus==='calculada')){
   const dependencies=weights.filter(w=>w.item_calculat_id===item.id);
   const missing=dependencies.filter(w=>!selectedIds.has(w.item_origen_id));
   if(missing.length){
    const names=missing.map(w=>items.find(x=>x.id===w.item_origen_id)?.nom||'columna desconeguda');
    error.textContent='Per copiar «'+item.nom+'», selecciona també: '+names.join(', ')+'.';return;
   }
  }
  const destName=EVALUATIONS.find(x=>x[0]===destination.value)?.[1]||destination.value;
  const message='Copiar '+selected.length+' columna(es) de '+EVALUATIONS.find(x=>x[0]===sourceEvaluation)[1]+' a '+destName+'?\n'+
   (gradesBox.checked?'També es copiaran les notes.':'Les notes quedaran buides.')+'\n\nLes originals no es modificaran.';
  if(!confirm(message))return;
  save.disabled=true;cancel.disabled=true;save.textContent='Copiant…';
  try{
   const result=await api('/rest/v1/rpc/copiar_items_avaluacio',accessToken,{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({p_items_origen:selected.map(x=>x.id),p_avaluacio_desti:destination.value,p_copiar_notes:gradesBox.checked})
   });
   if(Number(result)!==selected.length)throw Error('La resposta del servidor no coincideix amb les columnes seleccionades.');
   overlay.remove();activeEvaluation=destination.value;
   await showClass(classe);
   status('✓ '+selected.length+' columnes copiades a '+destName+(gradesBox.checked?' amb notes.':' sense notes.'));
  }catch(err){error.textContent='No s’han pogut copiar les columnes: '+err.message}
  finally{save.disabled=false;cancel.disabled=false;save.textContent='Copiar columnes'}
 };
}


// Eliminació amb advertiments: Supabase/RLS ha de validar els permisos del docent.
async function jediDeleteItem({classe,item,weights,grades}){
 if(weights.some(w=>w.item_origen_id===item.id)){alert('Aquesta columna forma part d’una fórmula. Treu-la primer de les ponderacions corresponents.');return}
 const linked=grades.filter(g=>g.item_id===item.id);
 const own=weights.filter(w=>w.item_calculat_id===item.id);
 const summary='«'+item.nom+'»';
 if(!confirm('Vols eliminar definitivament la columna '+summary+'?'+(item.es_nota_final?'\n\n★ Aquesta columna és la nota final de l’avaluació. En eliminar-la, l’avaluació quedarà sense columna de nota final fins que en seleccionis una altra.':'')+(linked.length?'\n\nConté '+linked.length+' qualificació(ns), que també s’eliminaran.':'')+(own.length?'\nTambé s’eliminaran les seves ponderacions.':'')+'\n\nAquesta acció no es pot desfer.'))return;
 if(linked.length&&!confirm('SEGONA CONFIRMACIÓ\n\nS’eliminaran '+linked.length+' qualificació(ns) de '+summary+'.\n\nEstàs segur que vols continuar?'))return;
 try{
  // Abans de tocar notes, comprovem que RLS permet gestionar aquesta columna.
  // La verificació definitiva dels permisos ha de ser al servidor, no al navegador.
  const check=await api('/rest/v1/items_avaluacio?select=id,professor_id&id=eq.'+encodeURIComponent(item.id),accessToken);
  if(!Array.isArray(check)||check.length!==1)throw Error('No s’ha pogut verificar la columna.');
  if(String(check[0].professor_id)!==String(profile.id))throw Error('Només pots eliminar columnes creades per tu.');
  if(linked.length){
   const removed=await api('/rest/v1/qualificacions?item_id=eq.'+encodeURIComponent(item.id),accessToken,{method:'DELETE',headers:{Prefer:'return=representation'}});
   if(!Array.isArray(removed)||removed.length!==linked.length)throw Error('No s’ha confirmat l’eliminació de totes les notes. Comprova els permisos i torna a carregar la classe.');
  }
  if(own.length){
   await api('/rest/v1/ponderacions?item_calculat_id=eq.'+encodeURIComponent(item.id),accessToken,{method:'DELETE',headers:{Prefer:'return=minimal'}});
  }
  const result=await api('/rest/v1/items_avaluacio?id=eq.'+encodeURIComponent(item.id),accessToken,{method:'DELETE',headers:{Prefer:'return=representation'}});
  if(!Array.isArray(result)||result.length!==1)throw Error('Supabase no ha confirmat l’eliminació de la columna. Comprova els permisos RLS.');
  await showClass(classe);status('✓ Columna '+summary+' eliminada de Supabase'+(linked.length?' amb '+linked.length+' qualificació(ns).':'.'));
 }catch(err){alert('No s’ha pogut completar l’eliminació: '+err.message+'\n\nAtenció: si s’han eliminat notes abans de l’error, l’operació pot haver quedat parcialment aplicada. Revisa la classe.');await showClass(classe)}
}

 const origins=items.filter(i=>i.tipus==='manual');
 const overlay=document.createElement('div');overlay.className='modal-back';const card=document.createElement('section');card.className='modal';
 const title=document.createElement('h3');title.textContent='Ponderacions · '+item.nom;
 const desc=document.createElement('p');desc.textContent='Selecciona els conceptes manuals i reparteix el 100 %. Les notes pendents no es compten com a zero.';
 const rows=document.createElement('div');const validation=document.createElement('div');validation.className='jedi-formula-status bad';validation.setAttribute('role','status');
 const error=document.createElement('p');error.className='error';const actions=document.createElement('div');actions.className='modal-actions';
 const add=document.createElement('button');add.type='button';add.className='secondary';add.textContent='+ Afegir concepte';
 const cancel=document.createElement('button');cancel.type='button';cancel.className='secondary';cancel.textContent='Cancel·lar';cancel.onclick=()=>overlay.remove();
 const save=document.createElement('button');save.type='button';save.className='primary';save.textContent='Desar fórmula';
 function collect(){return [...rows.children].map(r=>({item_origen_id:r.querySelector('select').value,percentatge:Number(r.querySelector('input').value)}))}
 function validate(){const data=collect();const sum=data.reduce((n,x)=>n+x.percentatge,0);const delta=Math.round((100-sum)*100)/100;
  const valid=data.length>0&&data.every(x=>x.item_origen_id&&Number.isFinite(x.percentatge)&&x.percentatge>0&&x.percentatge<=100)&&new Set(data.map(x=>x.item_origen_id)).size===data.length&&Math.abs(delta)<.000001;
  validation.className='jedi-formula-status '+(valid?'good':'bad');
  validation.textContent=!data.length?'Afegeix com a mínim un concepte.':new Set(data.map(x=>x.item_origen_id)).size!==data.length?'Hi ha conceptes repetits.':data.some(x=>!x.item_origen_id||!Number.isFinite(x.percentatge)||x.percentatge<=0||x.percentatge>100)?'Selecciona conceptes i percentatges entre 0 i 100.':delta>0?'Falten '+delta.toLocaleString('ca-ES')+' punts percentuals.':delta<0?'Sobren '+(-delta).toLocaleString('ca-ES')+' punts percentuals.':'✓ Ponderació correcta: 100 %.';
  save.disabled=!valid;return valid;
 }
 function addRow(id='',percentage=''){
  const row=document.createElement('div');row.className='jedi-formula-row';const select=document.createElement('select');
  const empty=document.createElement('option');empty.value='';empty.textContent='Selecciona un concepte';select.append(empty);
  for(const origin of origins){const option=document.createElement('option');option.value=origin.id;option.textContent=origin.nom;select.append(option)}select.value=id;
  const number=document.createElement('input');number.type='number';number.min='0.01';number.max='100';number.step='0.01';number.placeholder='%';number.value=percentage;
  const remove=document.createElement('button');remove.type='button';remove.className='secondary';remove.textContent='×';remove.title='Eliminar concepte';remove.onclick=()=>{row.remove();validate()};
  select.onchange=validate;number.oninput=validate;row.append(select,number,remove);rows.append(row);validate();
 }
 add.onclick=()=>addRow();cancel.onclick=()=>overlay.remove();actions.append(add,cancel,save);
 card.append(title,desc,rows,validation,error,actions);overlay.append(card);shell.append(overlay);
 if(weights.length){for(const w of weights)addRow(w.item_origen_id,String(w.percentatge))}else if(origins.length)addRow();
 if(!origins.length){error.textContent='Primer has de crear algun concepte manual.';add.disabled=true}
 validate();
 save.onclick=async()=>{if(!validate())return;error.textContent='';save.disabled=true;
  try{await api('/rest/v1/rpc/desar_ponderacions',accessToken,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({p_item_calculat_id:item.id,p_ponderacions:collect()})});
   overlay.remove();await showClass(classe);status('✓ Fórmula '+item.nom+' desada correctament.');
  }catch(err){error.textContent='No s’ha pogut desar: '+err.message;validate()}
 };
}
form.addEventListener('submit',async e=>{e.preventDefault();message.textContent='';submit.disabled=true;
 try{await login($('paAuthEmail').value.trim(),$('paAuthPass').value)}catch(err){showLogin('No s’ha pogut iniciar sessió: '+err.message)}finally{submit.disabled=false}
});
$('jediLogout').addEventListener('click',()=>{showLogin();$('paAuthPass').value='';});
// Versió de prova: les qualificacions es desen a la base de dades Jedi, no a Paideia real.
});
</script>
