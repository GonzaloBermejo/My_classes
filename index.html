<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graella de classe</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#252b35;background:#f7f8fa}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}header{background:white;border-bottom:1px solid #e8ebef;padding:23px max(24px,calc((100vw - 1200px)/2));display:flex;justify-content:space-between;align-items:center}header strong{font-size:21px;letter-spacing:-.6px}header span{color:#8a929f;font-size:13px}main{max-width:1200px;margin:42px auto;padding:0 24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}.top h1{margin:0;font-size:28px;letter-spacing:-.8px}.sub{margin:7px 0 0;color:#87909c;font-size:14px}.layout{display:grid;grid-template-columns:245px minmax(0,1fr);gap:24px}.panel{background:white;border:1px solid #e8ebef;border-radius:14px;overflow:hidden}.side{padding:17px}.side-title{font-size:12px;text-transform:uppercase;letter-spacing:1.1px;color:#8d96a2;font-weight:700;margin:6px 8px 15px}.class-btn{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;background:transparent;padding:12px 13px;border-radius:9px;text-align:left;color:#4b5563;margin-bottom:4px}.class-btn.active{background:#eef2ff;color:#4058a8;font-weight:650}.class-btn:hover:not(.active){background:#f6f7f9}.count{font-size:12px;color:#9ba3ae}.add-side{width:100%;background:white;border:1px dashed #d5dbe4;border-radius:9px;padding:12px;color:#687586;margin-top:13px}.add-side:hover{background:#f8faff}.content-head{padding:23px 25px;display:flex;justify-content:space-between;align-items:center;gap:15px;border-bottom:1px solid #edf0f3}.content-head h2{margin:0;font-size:21px;letter-spacing:-.5px}.hint{color:#9aa2ad;font-size:12px;margin-top:5px}.actions{display:flex;gap:9px;flex-wrap:wrap}button.primary{background:#344d96;color:white;border:1px solid #344d96;padding:10px 14px;border-radius:8px;font-size:13px;font-weight:600}button.secondary{background:white;color:#667181;border:1px solid #e0e5eb;padding:10px 13px;border-radius:8px;font-size:13px}button:hover{filter:brightness(.97)}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left}th{background:#fafbfc;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:#9ba4b0;font-weight:700;padding:15px 22px;border-bottom:1px solid #edf0f3}td{padding:11px 22px;border-bottom:1px solid #f0f2f5;font-size:14px}tr:last-child td{border-bottom:0}tbody tr:hover{background:#fafbff}.num{color:#a5adba;width:65px}.grade-input{width:94px;min-width:75px;border:1px solid transparent;background:transparent;border-radius:6px;padding:8px 9px;color:#303946;text-align:center}.grade-input:hover{border-color:#e6eaf0}.grade-input:focus{outline:none;border-color:#a4b2e0;background:white}.item-head{display:flex;align-items:center;gap:5px;white-space:nowrap}.item-edit{border:0;background:transparent;color:inherit;font:inherit;text-transform:inherit;letter-spacing:inherit;cursor:pointer;padding:3px}.item-remove{border:0;background:transparent;color:#b0b8c4;font-size:16px;padding:2px 5px}.item-remove:hover{color:#be4b52}.name-input{border:1px solid transparent;border-radius:6px;background:transparent;padding:8px 9px;width:100%;min-width:130px;color:#303946}.name-input:hover{border-color:#e6eaf0}.name-input:focus{outline:none;border-color:#a4b2e0;background:white}.delete{border:0;background:transparent;color:#aab2bd;font-size:18px;border-radius:6px;padding:5px 10px}.delete:hover{color:#be4b52;background:#fff0f1}.empty{padding:65px 20px;text-align:center;color:#9aa3af;font-size:14px}.footer{margin-top:18px;font-size:12px;color:#9ca5b1;text-align:right}@media(max-width:700px){header{padding:20px 24px}.layout{grid-template-columns:1fr}main{margin:25px auto}.content-head{align-items:flex-start;flex-direction:column}.top h1{font-size:24px}}
</style>
</head>
<body>
<header><strong>Graella<span> · Aula</span></strong><span>Espai de gestió de classes</span></header>
<main><div class="top"><div><h1>Les meves classes</h1><p class="sub">Organitza els teus grups i alumnes en un sol lloc.</p></div></div><div class="layout"><aside class="panel side"><div class="side-title">Classes</div><div id="classes"></div><button class="add-side" id="addClass">+ Afegir classe</button></aside><section class="panel"><div class="content-head"><div><h2 id="classTitle"></h2><div class="hint" id="classInfo"></div></div><div class="actions"><button class="secondary" id="renameClass">Canviar nom</button><button class="secondary" id="deleteClass">Eliminar classe</button><button class="secondary" id="addItem">+ Afegir ítem</button><button class="primary" id="addStudent">+ Afegir alumne</button></div></div><div id="tableArea"></div></section></div><div class="footer">Les dades es desen automàticament en aquest navegador.</div></main>
<script>
const KEY='graella-aula-v1';
const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());
let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}
if(!data||!Array.isArray(data.classes)){data={classes:[{id:uid(),name:'1r ESO A',students:[]}],active:null};data.active=data.classes[0].id}
data.classes.forEach(c=>{if(!Array.isArray(c.items))c.items=[];c.students.forEach(s=>{if(!s.grades||typeof s.grades!=='object')s.grades={}})});
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function current(){return data.classes.find(c=>c.id===data.active)||data.classes[0]}
function render(){const list=document.getElementById('classes');list.replaceChildren();data.classes.forEach(c=>{let b=document.createElement('button');b.className='class-btn'+(current()?.id===c.id?' active':'');let n=document.createElement('span');n.textContent=c.name;let count=document.createElement('span');count.className='count';count.textContent=c.students.length;b.append(n,count);b.onclick=()=>{data.active=c.id;save();render()};list.append(b)});let c=current();document.getElementById('classTitle').textContent=c?.name||'Cap classe';document.getElementById('classInfo').textContent=c?`${c.students.length} alumnes`:'Crea una classe per començar';['renameClass','deleteClass','addStudent','addItem'].forEach(id=>document.getElementById(id).disabled=!c);let area=document.getElementById('tableArea');area.replaceChildren();if(!c){let empty=document.createElement('div');empty.className='empty';empty.textContent=c?'Encara no hi ha alumnes. Afegeix el primer alumne.':'Encara no hi ha classes.';area.append(empty);return}let wrap=document.createElement('div');wrap.className='table-wrap';let table=document.createElement('table');table.innerHTML='<thead><tr><th>#</th><th>Nom i cognoms</th><th></th></tr></thead>';let body=document.createElement('tbody');c.students.forEach((s,i)=>{let tr=document.createElement('tr');let num=document.createElement('td');num.className='num';num.textContent=String(i+1).padStart(2,'0');let name=document.createElement('td');let input=document.createElement('input');input.className='name-input';input.value=s.name;input.setAttribute('aria-label','Nom de l’alumne');input.oninput=()=>{s.name=input.value;save()};name.append(input);tr.append(num,name);c.items.forEach(item=>{let td=document.createElement('td');let grade=document.createElement('input');grade.className='grade-input';grade.type='text';grade.inputMode='decimal';grade.placeholder='—';grade.value=s.grades[item.id]??'';grade.setAttribute('aria-label',item.name+' · '+s.name);grade.oninput=()=>{s.grades[item.id]=grade.value;save()};td.append(grade);tr.append(td)});let action=document.createElement('td');action.style.textAlign='right';let del=document.createElement('button');del.className='delete';del.textContent='×';del.title='Eliminar alumne';del.onclick=()=>{if(confirm(`Vols eliminar ${s.name||'aquest alumne'}?`)){c.students.splice(i,1);save();render()}};action.append(del);tr.append(action);body.append(tr)});table.append(body);wrap.append(table);area.append(wrap)}
document.getElementById('addItem').onclick=()=>{let c=current();if(!c)return;let name=prompt('Nom del nou ítem (per exemple, Examen 1):');if(!name?.trim())return;c.items.push({id:uid(),name:name.trim()});save();render()};
document.getElementById('addClass').onclick=()=>{let name=prompt('Nom de la nova classe:');if(!name?.trim())return;let c={id:uid(),name:name.trim(),students:[]};data.classes.push(c);data.active=c.id;save();render()};
document.getElementById('renameClass').onclick=()=>{let c=current();if(!c)return;let name=prompt('Nou nom de la classe:',c.name);if(!name?.trim())return;c.name=name.trim();save();render()};
document.getElementById('deleteClass').onclick=()=>{let c=current();if(!c||!confirm(`Vols eliminar la classe "${c.name}" i tots els seus alumnes?`))return;data.classes=data.classes.filter(x=>x.id!==c.id);data.active=data.classes[0]?.id||null;save();render()};
document.getElementById('addStudent').onclick=()=>{let c=current();if(!c)return;let name=prompt('Nom i cognoms de l’alumne:');if(!name?.trim())return;c.students.push({id:uid(),name:name.trim()});save();render()};
save();render();
</script>
</body></html>
