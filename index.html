<style>

l p{font-size:13px;color:#7d8795}.modal label{font-size:13px;color:#5d6877;display:block;margin:14px 0 6px}.modal input,.modal select{width:100%;padding:10px;border:1px solid #dce2eb;border-radius:8px;background:white}.weight-row{display:grid;grid-template-columns:1fr 110px;gap:12px;align-items:end}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}.error{color:#bd3d4b!important;min-height:18px} .student-link{border:0;background:transparent;text-align:left;color:#344d96;font-weight:600;padding:7px 3px;cursor:pointer}.student-link:hover{text-decoration:underline}.drag-handle{border:0;background:transparent;color:#a4adba;cursor:grab;font-size:19px;padding:4px 7px}.dragging{opacity:.4}.drop-target{outline:2px solid #8ca0d6;outline-offset:-2px}.sort-bar{padding:12px 22px;border-bottom:1px solid #edf0f3;display:flex;align-items:center;gap:12px;font-size:12px;color:#748092}.sort-bar select{padding:7px;border:1px solid #e0e5eb;border-radius:7px;background:white;color:#526075}.student-notes{width:100%;min-height:170px;resize:vertical;border:1px solid #dce2eb;border-radius:9px;padding:12px;line-height:1.5}.student-notes:focus{outline:none;border-color:#879bd2;box-shadow:0 0 0 3px #e9eeff}.modal input:focus,.modal select:focus{outline:none;border-color:#879bd2;box-shadow:0 0 0 3px #e9eeff}.note-hint{font-size:12px;color:#8b95a3}.grade-input.grade-fail,.calculated.grade-fail{background:#fceced;color:#a3454b;border-radius:7px}.grade-input.grade-pass,.calculated.grade-pass{background:#eaf6ee;color:#337b51;border-radius:7px}.calculated{display:inline-block;min-width:76px;padding:8px 10px}.search-input{padding:8px 11px;border:1px solid #e0e5eb;border-radius:7px;min-width:190px;max-width:100%;font-size:13px;color:#526075}.search-input:focus{outline:none;border-color:#879bd2;box-shadow:0 0 0 3px #e9eeff}.search-count{color:#9aa3af}.footer{margin-top:18px;font-size:12px;color:#9ca5b1;text-align:right}@media(max-width:700px){header{padding:20px 24px}.layout{g .profile-section{border-top:1px solid #edf0f3;margin-top:20px;padding-top:15px}.profile-section h4{margin:0 0 12px;font-size:14px;color:#3f4b60}.profile-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0}.profile-row label{margin:0!important}.profile-row select{max-width:135px}.sibling-entry{display:grid;grid-template-columns:1fr 125px 32px;gap:8px;margin:8px 0}.sibling-entry input{min-width:0}.mini-remove{border:0;background:#fff1f2;border-radius:7px;color:#b35058}.modal{max-height:90vh;overflow-y:auto}.modal input:focus,.modal select:focus,.modal textarea:focus{outline:none;border-color:#879bd2;box-shadow:0 0 0 3px #e9eeff}

.excel-modal{width:min(940px,100%);max-height:92vh;overflow:auto}.excel-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.excel-grid label{margin:0}.excel-grid select,.excel-grid input{margin-top:5px}.excel-sheet{border:1px solid #e4e8ef;border-radius:10px;margin:12px 0;padding:14px}.excel-sheet-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.excel-sheet-head input{width:auto}.excel-sheet-head strong{font-size:14px}.excel-preview{overflow:auto;max-height:240px;border:1px solid #e8ebef;border-radius:8px;margin-top:12px}.excel-preview table{width:100%;font-size:12px}.excel-preview td,.excel-preview th{padding:7px 10px;white-space:nowrap;max-width:250px;overflow:hidden;text-overflow:ellipsis}.excel-preview th{position:sticky;top:0;z-index:1}.excel-help{font-size:12px;color:#718096}.excel-warning{color:#9a641e;background:#fff7e8;border-radius:8px;padding:9px 12px;font-size:12px}.excel-footer{position:sticky;bottom:-25px;background:white;border-top:1px solid #edf0f3;padding-top:12px}.excel-sheet[aria-disabled="true"]{opacity:.58}

<body>
<header><strong>Graella<span> · Aula</span></strong><span>Espai de gestió de classes</span></header>
<main><div class="top"><div><h1>Les meves classes</h1><p class="sub">Organitza els teus grups i alumnes en un sol lloc.</p></div><div class="backup-actions"><button class="secondary" id="exportExcel" type="button">↓ Exportar Excel</button><button class="secondary undo-btn" id="undoGrade" type="button" disabled title="Desfer el darrer canvi de notes (Ctrl+Z)">↶ Desfer</button><button class="secondary" id="exportData" type="button">↓ Exportar dades</button><button class="secondary" id="importData" type="button">↑ Importar dades</button><button class="secondary" id="importExcel" type="button">↑ Importar Excel</button><input id="excelFile" type="file" accept=".xlsx,.xls,.xlsm,.csv" style="display:none"><input id="importFile" type="file" accept=".json,application/json"></div></div><div class="layout"><aside class="panel side"><div class="side-title">Classes</div><div id="classes"></div><button class="add-side" id="addClass">+ Afegir classe</button></aside><section class="panel"><div class="content-head"><div><h2 id="classTitle"></h2><div class="hint" id="classInfo"></div></div><div class="actions"><button class="secondary" id="renameClass">Canviar nom</button><button class="secondary" id="deleteClass">Eliminar classe</button><button class="secondary" id="addItem">+ Afegir ítem</button><button class="primary" id="addStudent">+ Afegir alumne</button></div></div><div id="tableArea"></div></section></div><div class="footer">Les dades es desen automàticament en aquest navegador.</div></main><div id="modalRoot"></div>
<script>
const KEY='graella-aula-v1';
const undoStack=[];let applyingUndo=false;
function rememberGradeChange(c,s,item,oldValue){if(applyingUndo)return;undoStack.push({classId:c.id,studentId:s.id,itemId:item.id,oldValue});if(undoStack.length>100)undoStack.shift();updateUndoButton()}
function updateUndoButton(){const b=document.getElementById('undoGrade');if(b)b.disabled=!undoStack.length}
function setGrade(c,s,item,value,{remember=true}={}){const old=s.grades?.[item.id]??'';if(String(old)===String(value))return false;if(remember)rememberGradeChange(c,s,item,old);(s.grades??={})[item.id]=String(value);save();return true}
function undoGrade(){const last=undoStack.pop();if(!last)return;const c=data.classes.find(x=>x.id===last.classId),s=c?.students.find(x=>x.id===last.studentId),item=c?.items.find(x=>x.id===last.itemId);if(s&&item){applyingUndo=true;setGrade(c,s,item,last.oldValue,{remember:false});applyingUndo=false;render()}updateUndoButton()}

const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());
let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}
if(!data||!Array.isArray(data.classes)){data={classes:[{id:uid(),name:'1r ESO A',students:[]}],active:null};data.active=data.classes[0].id}
data.classes.forEach(c=>{if(!Array.isArray(c.items))c.items=[];if(!Array.isArray(c.students))c.students=[];c.students.forEach(s=>{if(!s.grades||typeof s.grades!=='object')s.grades={};if(typeof s.firstName!=='string'){const a=String(s.name||'').trim().split(/\s+/);s.firstName=a.shift()||'';s.lastName=a.join(' ')};if(typeof s.notes!=='string')s.notes=''})});
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function current(){const c=data.classes.find(c=>c.id===data.active)||data.classes[0];if(c){if(!Array.isArray(c.items))c.items=[];if(!Array.isArray(c.students))c.students=[];c.students.forEach(s=>{if(!s.grades||typeof s.grades!=='object')s.grades={};if(typeof s.firstName!=='string'){const a=String(s.name||'').trim().split(/\s+/);s.firstName=a.shift()||'';s.lastName=a.join(' ')};if(typeof s.notes!=='string')s.notes=''})}return c}
function calcValue(c,s,item,seen=new Set()){
 if(seen.has(item.id))return null;
 if(item.type!=='calculated'){
  const raw=s.grades?.[item.id];if(raw===undefined||String(raw).trim()==='')return null;
  const value=Number(String(raw).replace(',','.'));return Number.isFinite(value)?value:null;
 }
 if(!Array.isArray(item.weights)||!item.weights.length)return null;
 const next=new Set(seen);next.add(item.id);let result=0;
 for(const part of item.weights){const source=c.items.find(x=>x.id===part.id);if(!source)return null;const value=calcValue(c,s,source,next);if(value===null)return null;result+=value*Number(part.percent)/100}
 return Number.isFinite(result)?result:null;
}
function gradeColor(el,raw){const str=String(raw??'').trim();const value=str===''?NaN:Number(str.replace(',','.'));el.classList.toggle('grade-fail',Number.isFinite(value)&&value<5);el.classList.toggle('grade-pass',Number.isFinite(value)&&value>=5)}
function refreshCalculated(c){document.querySelectorAll('[data-calc]').forEach(el=>{const student=c.students.find(s=>s.id===el.dataset.student);const item=c.items.find(x=>x.id===el.dataset.calc);if(!student||!item)return;const value=calcValue(c,student,item);el.textContent=value===null?'—':value.toFixed(2).replace('.',',');gradeColor(el,value===null?'':value)})}
function displayName(s){return [s.firstName,s.lastName].filter(Boolean).join(' ')||s.name||''}
function orderedStudents(c){const a=[...c.students];if(c.orderMode!=='manual')a.sort((x,y)=>(x.lastName||'').localeCompare(y.lastName||'','ca',{sensitivity:'base'})||(x.firstName||'').localeCompare(y.firstName||'','ca',{sensitivity:'base'}));return a}
function openStudent(c,s){const root=document.getElementById('modalRoot');root.replaceChildren();const back=document.createElement('div');back.className='modal-back';const modal=document.createElement('div');modal.className='modal';const title=document.createElement('h3');title.textContent='Fitxa de l’alumne';const hint=document.createElement('p');hint.textContent=c.name+' · Les modificacions es desen automàticament';const firstLabel=document.createElement('label');firstLabel.textContent='Nom';const first=document.createElement('input');first.value=s.firstName||'';const lastLabel=document.createElement('label');lastLabel.textContent='Cognoms';const last=document.createElement('input');last.value=s.lastName||'';const profile=document.createElement('section');profile.className='profile-section';
 const ph=document.createElement('h4');ph.textContent='Informació acadèmica';profile.append(ph);
 const makeChoice=(text,key)=>{const row=document.createElement('div');row.className='profile-row';const label=document.createElement('label');label.textContent=text;const select=document.createElement('select');[['no','No'],['si','Sí']].forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;select.append(o)});select.value=s[key]==='si'?'si':'no';select.onchange=()=>{s[key]=select.value;save();if(key==='siblingsAtSchool')siblingArea.hidden=select.value!=='si'};row.append(label,select);profile.append(row);return select};
 makeChoice('Pla individualitzat (PI)','pi');makeChoice('Repetidor/a','repeater');const siblingChoice=makeChoice('Germans al centre','siblingsAtSchool');
 const siblingArea=document.createElement('div');const siblingTitle=document.createElement('label');siblingTitle.textContent='Germans / germanes (nom i curs)';siblingArea.append(siblingTitle);const siblingRows=document.createElement('div');siblingArea.append(siblingRows);
 const siblingList=()=>Array.isArray(s.siblings)?s.siblings:(s.siblings=[]);
 const drawSiblings=()=>{siblingRows.replaceChildren();siblingList().forEach((sib,i)=>{const row=document.createElement('div');row.className='sibling-entry';const n=document.createElement('input');n.placeholder='Nom i cognoms';n.value=sib.name||'';const course=document.createElement('input');course.placeholder='Curs';course.value=sib.course||'';const del=document.createElement('button');del.type='button';del.className='mini-remove';del.textContent='×';del.title='Eliminar germà/ana';n.oninput=()=>{sib.name=n.value;save()};course.oninput=()=>{sib.course=course.value;save()};del.onclick=()=>{s.siblings.splice(i,1);save();drawSiblings()};row.append(n,course,del);siblingRows.append(row)})};
 const addSibling=document.createElement('button');addSibling.type='button';addSibling.className='secondary';addSibling.textContent='+ Afegir germà/ana';addSibling.onclick=()=>{siblingList().push({name:'',course:''});save();drawSiblings()};siblingArea.append(addSibling);profile.append(siblingArea);siblingArea.hidden=siblingChoice.value!=='si';drawSiblings();
 const joinedLabel=document.createElement('label');joinedLabel.textContent='Data d’incorporació (opcional)';const joined=document.createElement('input');joined.type='date';joined.value=s.joinedDate||'';joined.onchange=()=>{s.joinedDate=joined.value;save()};profile.append(joinedLabel,joined);
 const pendingLabel=document.createElement('label');pendingLabel.textContent='Matèries pendents (opcional)';const pending=document.createElement('input');pending.placeholder='Ex.: Matemàtiques de 1r';pending.value=s.pendingSubjects||'';pending.oninput=()=>{s.pendingSubjects=pending.value;save()};profile.append(pendingLabel,pending);
 const noteLabel=document.createElement('label');noteLabel.textContent='Observacions';const notes=document.createElement('textarea');notes.className='student-notes';notes.placeholder='Anotacions acadèmiques...';notes.value=s.notes||'';const saveField=()=>{s.firstName=first.value;s.lastName=last.value;s.name=displayName(s);s.notes=notes.value;save()};[first,last,notes].forEach(el=>el.addEventListener('input',saveField));const info=document.createElement('p');info.className='note-hint';info.textContent='Evita introduir dades personals sensibles: la informació es guarda en aquest navegador.';const actions=document.createElement('div');actions.className='modal-actions';const closeBtn=document.createElement('button');closeBtn.className='primary';closeBtn.textContent='Tancar';const close=()=>{saveField();root.replaceChildren();render()};closeBtn.onclick=close;back.onclick=e=>{if(e.target===back)close()};actions.append(closeBtn);modal.append(title,hint,firstLabel,first,lastLabel,last,profile,noteLabel,notes,info,actions);back.append(modal);root.append(back);first.focus()}
function openNewStudent(c){const root=document.getElementById('modalRoot');root.replaceChildren();const back=document.createElement('div');back.className='modal-back';const modal=document.createElement('div');modal.className='modal';const title=document.createElement('h3');title.textContent='Afegir alumne';const label1=document.createElement('label');label1.textContent='Nom';const first=document.createElement('input');first.placeholder='Nom';const label2=document.createElement('label');label2.textContent='Cognoms';const last=document.createElement('input');last.placeholder='Cognoms';const error=document.createElement('p');error.className='error';const actions=document.createElement('div');actions.className='modal-actions';const cancel=document.createElement('button');cancel.className='secondary';cancel.textContent='Cancel·lar';cancel.onclick=()=>root.replaceChildren();const ok=document.createElement('button');ok.className='primary';ok.textContent='Afegir alumne';ok.onclick=()=>{if(!first.value.trim()||!last.value.trim()){error.textContent='Introdueix el nom i els cognoms.';return}const f=first.value.trim(),l=last.value.trim();c.students.push({id:uid(),firstName:f,lastName:l,name:f+' '+l,notes:'',grades:{}});save();root.replaceChildren();render()};last.onkeydown=e=>{if(e.key==='Enter')ok.click()};actions.append(cancel,ok);modal.append(title,label1,first,label2,last,error,actions);back.append(modal);back.onclick=e=>{if(e.target===back)root.replaceChildren()};root.append(back);first.focus()}
function render(){

function validBackup(candidate){
 if(!candidate||typeof candidate!=='object'||Array.isArray(candidate)||!Array.isArray(candidate.classes))return false;
 if(candidate.classes.length>500)return false;
 const ids=new Set();
 for(const c of candidate.classes){
  if(!c||typeof c!=='object'||typeof c.id!=='string'||!c.id||ids.has(c.id)||typeof c.name!=='string'||!Array.isArray(c.students)||!Array.isArray(c.items||[]))return false;
  ids.add(c.id);
  if(c.students.length>10000||(c.items||[]).length>1000)return false;
  const itemIds=new Set();
  for(const item of c.items||[]){
   if(!item||typeof item.id!=='string'||!item.id||itemIds.has(item.id)||typeof item.name!=='string')return false;
   itemIds.add(item.id);
   if(item.type==='calculated'&&(!Array.isArray(item.weights)||item.weights.some(w=>!w||typeof w.id!=='string'||!Number.isFinite(Number(w.percent)))))return false;
  }
  const studentIds=new Set();
  for(const student of c.students){
   if(!student||typeof student.id!=='string'||!student.id||studentIds.has(student.id)||(!('name' in student)&&typeof student.firstName!=='string')|| (student.grades!==undefined&&(!student.grades||typeof student.grades!=='object'||Array.isArray(student.grades))))return false;
   studentIds.add(student.id);
  }
 }
 return true;
}

  const blob=new Blob([payload],{type:'application/json;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const link=document.createElement('a');link.href=url;link.download='graella-aula-'+new Date().toLocaleDateString('sv-SE')+'.json';
  document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);
 }catch(e){alert('No s’ha pogut exportar la còpia de seguretat. '+e.message)}
};
const backupInput=document.getElementById('importFile');
document.getElementById('importData').onclick=()=>backupInput.click();
backupInput.onchange=async()=>{
 const file=backupInput.files?.[0];backupInput.value='';if(!file)return;
 if(file.size>20*1024*1024){alert('El fitxer és massa gran (màxim 20 MB).');return}
 let incoming;
 try{incoming=JSON.parse(await file.text())}catch{alert('No es pot llegir aquest fitxer. Selecciona una còpia de seguretat JSON vàlida.');return}
 // Acceptem tant les exportacions directes com els embolcalls amb data.
 if(incoming&&incoming.format==='graella-aula-backup'&&incoming.data)incoming=incoming.data;
 if(!validBackup(incoming)){alert('Aquest JSON no té el format compatible amb Graella · Aula. No s’ha modificat cap dada.');return}
 const count=incoming.classes.reduce((n,c)=>n+c.students.length,0);
 if(!confirm(`Vols importar ${incoming.classes.length} classes i ${count} alumnes?\n\nATENCIÓ: se substituiran totes les classes, notes i observacions que tens actualment en aquest navegador. Et recomanem exportar abans una còpia de seguretat.`))return;
 try{
  const serialized=JSON.stringify(incoming);
  localStorage.setItem(KEY,serialized);
  // Només canviem l'estat en memòria després de confirmar el desament.
  data=incoming;undoStack.length=0;updateUndoButton();
  data.classes.forEach(c=>{if(!Array.isArray(c.items))c.items=[];if(!Array.isArray(c.students))c.students=[];c.students.forEach(s=>{if(!s.grades||typeof s.grades!=='object')s.grades={};if(typeof s.firstName!=='string'){const a=String(s.name||'').trim().split(/\s+/);s.firstName=a.shift()||'';s.lastName=a.join(' ')}if(typeof s.notes!=='string')s.notes=''})});
  if(!data.classes.some(c=>c.id===data.active))data.active=data.classes[0]?.id||null;
  save();render();alert('Dades importades correctament.');
 }catch(e){alert('No s’han pogut desar les dades importades: '+e.message)}
};
document.getElementById('undoGrade').onclick=undoGrade;
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&e.key.toLowerCase()==='z'&&!e.target.closest('input,textarea,[contenteditable]')){e.preventDefault();undoGrade()}});
document.getElementById('exportExcel').onclick=exportExcel;
document.getElementById('addItem').onclick=()=>{let c=current();if(!c)return;let type=confirm('Vols crear un ítem calculat amb percentatges?\n\nAcceptar: calculat\nCancel·lar: nota manual');if(type){openCalculated(c);return}let name=prompt('Nom del nou ítem (per exemple, Examen 1):');if(!name?.trim())return;c.items.push({id:uid(),name:name.trim()});save();render()};

document.getElementById('deleteClass').onclick=()=>{let c=current();if(!c||!confirm(`Vols eliminar la classe "${c.name}" i tots els seus alumnes?`))return;data.classes=data.classes.filter(x=>x.id!==c.id);data.active=data.classes[0]?.id||null;save();render()};

// Importació de fulls de càlcul. La biblioteca es carrega només quan es necessita.
let excelLibraryPromise=null;
function loadExcelLibrary(){
 if(window.XLSX)return Promise.resolve(window.XLSX);
 if(excelLibraryPromise)return excelLibraryPromise;
 excelLibraryPromise=new Promise((resolve,reject)=>{
  const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
  script.onload=()=>window.XLSX?resolve(window.XLSX):reject(Error('Biblioteca Excel no disponible'));
  script.onerror=()=>reject(Error('No es pot carregar el lector d’Excel. Comprova la connexió a Internet.'));
  document.head.append(script);
 }).catch(e=>{excelLibraryPromise=null;throw e});return excelLibraryPromise;
}
const excelFileInput=document.getElementById('excelFile');
document.getElementById('importExcel').onclick=()=>excelFileInput.click();
excelFileInput.onchange=async()=>{
 const file=excelFileInput.files?.[0];excelFileInput.value='';if(!file)return;
 if(file.size>15*1024*1024){alert('El fitxer supera el límit de 15 MB.');return}
 const button=document.getElementById('importExcel');button.disabled=true;button.textContent='Llegint Excel…';
 try{
  const XLSX=await loadExcelLibrary();const buf=await file.arrayBuffer();
  const book=XLSX.read(buf,{type:'array',cellFormula:true,cellDates:false,cellNF:false});
  const sheets=book.SheetNames.map(name=>{
   const sheet=book.Sheets[name];const range=XLSX.utils.decode_range(sheet['!ref']||'A1');
   const endRow=Math.min(range.e.r,10009),endCol=Math.min(range.e.c,99);
   const rows=[];let formulaCount=0;
   for(let r=range.s.r;r<=endRow;r++){
    const line=[];let nonempty=false;
    for(let col=range.s.c;col<=endCol;col++){
     const cell=sheet[XLSX.utils.encode_cell({r,c:col})];
     if(cell?.f)formulaCount++;
     let value=cell?.v??'';
     if(value instanceof Date)value=value.toLocaleDateString('ca-ES');
     if(typeof value==='number'&&Number.isFinite(value))value=String(Number(value.toPrecision(12)));
     value=String(value).trim();line.push(value);if(value)nonempty=true;
    }
    rows.push(line);
   }
   return {name,rows,formulaCount,offset:range.s.r};
  });
  showExcelImporter(sheets,file.name);
 }catch(e){alert('No s’ha pogut obrir el full de càlcul: '+e.message)}
 finally{button.disabled=false;button.textContent='↑ Importar Excel'}
};
function excelNorm(v){return String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase()}
function excelNumber(v){const raw=String(v??'').trim().replace(/\s/g,'');if(!raw)return null;let n=raw;if(/^[-+]?\d{1,3}(\.\d{3})+,\d+$/.test(n))n=n.replace(/\./g,'').replace(',','.');else if(n.includes(',')&&!n.includes('.'))n=n.replace(',','.');if(!/^[-+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(n))return null;const num=Number(n);return Number.isFinite(num)?num:null}
function excelGuess(sheet){
 const rows=sheet.rows;let best={score:-Infinity,header:0,nameCol:0};
 for(let r=0;r<Math.min(20,rows.length);r++)for(let col=0;col<Math.min(12,rows[r].length);col++){
  const v=excelNorm(rows[r][col]);let score=0;
  if(/^(nom|nombre)( i cognoms| y apellidos| complet| completo)?$/.test(v))score+=16;
  else if(v.includes('cognoms')||v.includes('apellidos')||v.includes('alumne')||v.includes('alumno'))score+=10;
  else if(v==='nom'||v==='nombre')score+=12;
  if(/^(llista|lista|n[uú]m|num|nº|#)$/.test(v))score-=12;
  const below=rows.slice(r+1,r+Math.min(rows.length-r,10)).filter(x=>{
   const t=String(x[col]||'').trim();return t.length>=3&&/[A-Za-zÀ-ÿ]/.test(t)&&!/^grupo?\s*\d+$/i.test(t)
  }).length;
  score+=below*1.2;if(v)score+=1;
  if(score>best.score)best={score,header:r,nameCol:col};
 }
 if(!rows.length)return {header:0,nameCol:0,columns:[]};
 const {header,nameCol}=best;
 const headers=rows[header]||[];
 const columns=headers.map((v,i)=>({i,name:String(v||'').trim()})).filter(x=>x.i!==nameCol&&x.name&&!/^(llista|lista|n[uú]m|num|nº|#|classe|clase|grupo|grup)$/i.test(excelNorm(x.name)));
 return {header,nameCol,columns};
}
function excelCandidateRow(row,nameCol){
 const name=String(row?.[nameCol]??'').trim();const norm=excelNorm(name);
 return name.length>=2&&/[A-Za-zÀ-ÿ]/.test(name)&&!/^\d+$/.test(name)&&!/^grup(o)?\s*\d+$/i.test(name)&&!/(^nom$|^nombre$|^alumn|^total$|^mitjana$|^media$)/i.test(norm)&&name.length<140;
}
function showExcelImporter(sheets,filename){
 const root=document.getElementById('modalRoot');root.replaceChildren();
 const back=document.createElement('div');back.className='modal-back';const modal=document.createElement('div');modal.className='modal excel-modal';
 modal.setAttribute('role','dialog');modal.setAttribute('aria-modal','true');
 const title=document.createElement('h3');title.textContent='Importar classes des d’Excel';
 const intro=document.createElement('p');intro.textContent=filename+' · Selecciona els fulls i comprova la vista prèvia. Es crearan classes noves; no es modificarà cap classe existent.';
 const warning=document.createElement('div');warning.className='excel-warning';warning.textContent='Les fórmules s’importen com a valors guardats al fitxer, no com a ponderacions automàtiques. Revisa les columnes i els noms compostos abans de confirmar.';
 modal.append(title,intro,warning);
 const configs=[];
 sheets.forEach(sheet=>{
  if(!sheet.rows.length)return;
  const guess=excelGuess(sheet);const panel=document.createElement('section');panel.className='excel-sheet';
  const heading=document.createElement('div');heading.className='excel-sheet-head';
  const enabled=document.createElement('input');enabled.type='checkbox';enabled.checked=sheet.rows.length>=3&&guess.columns.length>0&&/^(nom|nombre)/i.test(String(sheet.rows[guess.header]?.[guess.nameCol]||''));
  const name=document.createElement('input');name.value=sheet.name;name.style.width='175px';name.setAttribute('aria-label','Nom de la classe nova');
  const sheetLabel=document.createElement('strong');sheetLabel.textContent='Full: '+sheet.name;
  const count=document.createElement('span');count.className='excel-help';
  heading.append(enabled,sheetLabel,name,count);panel.append(heading);
  const controls=document.createElement('div');controls.className='excel-grid';
  const headerLabel=document.createElement('label');headerLabel.textContent='Fila de capçaleres';const headerSelect=document.createElement('select');
  for(let i=0;i<Math.min(30,sheet.rows.length);i++){const option=document.createElement('option');option.value=i;option.textContent='Fila '+(sheet.offset+i+1);headerSelect.append(option)}headerSelect.value=Math.min(guess.header,29);headerLabel.append(headerSelect);
  const nameLabel=document.createElement('label');nameLabel.textContent='Columna dels noms';const nameSelect=document.createElement('select');
  const maxCols=Math.max(1,...sheet.rows.slice(0,30).map(r=>r.length));
  for(let i=0;i<maxCols;i++){const opt=document.createElement('option');opt.value=i;opt.textContent='Columna '+(i+1)+' · '+String(sheet.rows[guess.header]?.[i]||'').slice(0,35);nameSelect.append(opt)}nameSelect.value=guess.nameCol;nameLabel.append(nameSelect);
  const modeLabel=document.createElement('label');modeLabel.textContent='Columnes a importar';const modeSelect=document.createElement('select');
  [['all','Amb capçalera (notes i altres camps)'],['numeric','Només columnes amb notes (0–10)'],['none','Només alumnes']].forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;modeSelect.append(o)});
  modeSelect.value=guess.columns.length?'numeric':'none';modeLabel.append(modeSelect);
  controls.append(headerLabel,nameLabel,modeLabel);panel.append(controls);
  const preview=document.createElement('div');preview.className='excel-preview';panel.append(preview);
  const hint=document.createElement('p');hint.className='excel-help';panel.append(hint);
  const cfg={sheet,enabled,name,headerSelect,nameSelect,modeSelect,preview,count,hint,panel};configs.push(cfg);
  const refresh=()=>{
   const result=excelExtract(cfg);count.textContent=result.students.length+' alumnes · '+result.items.length+' columnes';
   panel.setAttribute('aria-disabled',enabled.checked?'false':'true');
   const tbl=document.createElement('table');const thead=document.createElement('thead');const hr=document.createElement('tr');
   ['Nom detectat',...result.items.map(i=>i.name)].forEach(t=>{const th=document.createElement('th');th.textContent=t;hr.append(th)});thead.append(hr);tbl.append(thead);
   const tbody=document.createElement('tbody');result.students.slice(0,5).forEach(st=>{const tr=document.createElement('tr');[st.name,...result.items.map(i=>st.grades[i.id]??'—')].forEach(t=>{const td=document.createElement('td');td.textContent=t;tr.append(td)});tbody.append(tr)});tbl.append(tbody);preview.replaceChildren(tbl);
   hint.textContent=(sheet.formulaCount?'El full conté '+sheet.formulaCount+' cel·les amb fórmules. ':'')+'Vista prèvia: màxim 5 alumnes. Les notes fora de 0–10 s’ignoren en mode «Només columnes amb notes».';
  };
  [enabled,name,headerSelect,nameSelect,modeSelect].forEach(el=>el.addEventListener('change',refresh));refresh();modal.append(panel);
 });
 const footer=document.createElement('div');footer.className='modal-actions excel-footer';const cancel=document.createElement('button');cancel.className='secondary';cancel.textContent='Cancel·lar';const close=()=>root.replaceChildren();cancel.onclick=close;
 const importBtn=document.createElement('button');importBtn.className='primary';importBtn.textContent='Importar fulls seleccionats';
 importBtn.onclick=()=>{
  const selected=configs.filter(c=>c.enabled.checked).map(excelExtract).filter(x=>x.students.length);
  if(!selected.length){alert('Selecciona almenys un full amb alumnes detectats.');return}
  const n=selected.reduce((sum,x)=>sum+x.students.length,0);
  if(!confirm(`S’importaran ${selected.length} classes noves i ${n} alumnes. Les classes existents es conservaran. Vols continuar?`))return;
  const existing=new Set(data.classes.map(c=>c.name.toLocaleLowerCase('ca')));
  const created=selected.map(x=>{let name=x.name||'Classe importada';let suffix=2;const base=name;while(existing.has(name.toLocaleLowerCase('ca')))name=base+' (importada '+suffix+++')';existing.add(name.toLocaleLowerCase('ca'));return {id:uid(),name,students:x.students,items:x.items}});
  const previousActive=data.active;data.classes.push(...created);data.active=created[0].id;
  try{save()}catch(e){data.classes.splice(-created.length,created.length);data.active=previousActive;alert('No s’ha pogut desar la importació. '+e.message);return}
  close();render();alert(`Importació completada: ${created.length} classes i ${n} alumnes. Revisa les dades abans d’utilitzar-les.`);
 };
 footer.append(cancel,importBtn);modal.append(footer);back.append(modal);back.onclick=e=>{if(e.target===back)close()};root.append(back);
}
function excelExtract(cfg){
 const {sheet}=cfg,header=Number(cfg.headerSelect.value),nameCol=Number(cfg.nameSelect.value),mode=cfg.modeSelect.value;
 const rows=sheet.rows;const headings=rows[header]||[];
 const candidates=rows.slice(header+1).filter(row=>excelCandidateRow(row,nameCol));
 const cols=[];
 if(mode!=='none')for(let col=0;col<Math.max(...rows.slice(0,30).map(r=>r.length),0);col++){
  if(col===nameCol)continue;
  let heading=String(headings[col]||'').trim();
  if(!heading||/^(llista|lista|n[uú]m|num|nº|#|classe|clase|grup|grupo)$/i.test(excelNorm(heading)))continue;
  const vals=candidates.map(row=>String(row[col]??'').trim()).filter(Boolean);
  const nums=vals.filter(v=>{const n=excelNumber(v);return n!==null&&n>=0&&n<=10});
  if(mode==='numeric'&&(!nums.length||nums.length/Math.max(1,vals.length)<.7))continue;
  cols.push({index:col,id:uid(),name:heading});
 }
 const students=candidates.map(row=>{
  const full=String(row[nameCol]).trim().replace(/\s+/g,' ');const parts=full.split(' ');const firstName=parts.shift()||'';const lastName=parts.join(' ');
  const grades={};cols.forEach(col=>{const raw=String(row[col.index]??'').trim();const n=excelNumber(raw);if(n!==null&&n>=0&&n<=10)grades[col.id]=String(n)});
  return {id:uid(),name:full,firstName,lastName,grades,notes:''};
 });
 return {name:cfg.name.value.trim(),items:cols.map(({id,name})=>({id,name})),students};
}

save();render();
