<main><div class="top"><div><h1>Les meves classes</h1><button type="button" class="secondary" id="toggleSchedule" style="margin-top:10px">▦ El meu horari</button> <button type="button" class="secondary" id="toggleCentre" style="margin-top:10px">⌂ El meu centre</button> <button type="button" class="secondary" id="toggleComms" style="margin-top:10px">✉ Comunicats</button> <button type="button" class="secondary" id="toggleAttendance" style="margin-top:10px">✓ Passar llista</button><p class="sub">Organitza els teus grups i alumnes en un sol lloc.</p></div><div class="backup-actions"><button class="secondary" id="exportExcel" type="button">↓ Exportar Excel</button><button class="secondary undo-btn" id="undoGrade" type="button" disabled title="Desfer el darrer canvi de notes (Ctrl+Z)">↶ Desfer</button><button class="secondary" id="exportData" type="button">↓ Exportar dades</button><button class="secondary" id="importData" type="button">↑ Importar dades</button><button class="secondary" id="importExcel" type="button">↑ Importar Excel</button><input id="excelFile" type="file" accept=".xlsx,.xls,.xlsm,.csv" style="display:none"><input id="importFile" type="file" accept=".json,application/json"></div></div><div class="layout"><aside class="panel side"><div class="side-title">Classes</div><div id="classes"></div><button class="add-side" id="addClass">+ Afegir classe</button></aside><section class="panel"><div class="content-head"><div><h2 id="classTitle"></h2><div class="class-meta"><div class="hint" id="classInfo"></div><button type="button" class="tutor-edit" id="editTutor" title="Editar el nom del tutor o tutora">Tutor/a: <span id="tutorName">Afegir nom</span> <span class="tutor-pencil">✎</span></button></div></div><div class="actions"><button class="secondary" id="renameClass">Canviar nom</button><button class="secondary" id="deleteClass">Eliminar classe</button><button class="secondary" id="addItem">+ Afegir ítem</button><button class="primary" id="addStudent">+ Afegir alumne</button></div></div><div id="tableArea"></div></section></div><section class="panel schedule-panel" id="schedulePanel" hidden></section><section class="panel centre-panel" id="centrePanel" hidden></section><section class="panel comms-panel" id="commsPanel" hidden></section><section class="panel attendance-panel" id="attendancePanel" hidden></section><div class="footer"><span>Les dades es desen automàticament en aquest navegador.</span></div></main><div id="modalRoot"></div>
<script>
const KEY='graella-aula-v1';
const undoStack=[];let applyingUndo=false;
function rememberGradeChange(c,s,item,oldValue){if(applyingUndo)return;undoStack.push({classId:c.id,studentId:s.id,itemId:item.id,oldValue});if(undoStack.length>100)undoStack.shift();updateUndoButton()}
function updateUndoButton(){const b=document.getElementById('undoGrade');if(b)b.disabled=!undoStack.length}
function setGrade(c,s,item,value,{remember=true}={}){const old=s.grades?.[item.id]??'';if(String(old)===String(value))return false;if(remember)rememberGradeChange(c,s,item,old);(s.grades??={})[item.id]=String(value);save();return true}
function undoGrade(){const last=undoStack.pop();if(!last)return;const c=data.classes.find(x=>x.id===last.classId),s=c?.students.find(x=>x.id===last.studentId),item=c?.items.find(x=>x.id===last.itemId);if(s&&item){applyingUndo=true;setGrade(c,s,item,last.oldValue,{remember:false});applyingUndo=false;render()}updateUndoButton()}

const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());
let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}
if(!data||!Array.isArray(data.classes)){data={classes:[{id:uid(),name:'1r ESO A',students:[]}],active:null};data.active=data.classes[0].id}
data.classes.forEach(c=>{if(!Array.isArray(c.items))c.items=[];if(!Array.isArray(c.students))c.students=[];c.students.forEach(s=>{if(!s.grades||typeof s.grades!=='object')s.grades={};if(typeof s.firstName!=='string'){const a=String(s.name||'').trim().split(/\s+/);s.firstName=a.shift()||'';s.lastName=a.join(' ')};if(typeof s.notes!=='string')s.notes=''})});
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function current(){const c=data.classes.find(c=>c.id===data.active)||data.classes[0];if(c){if(!Array.isArray(c.items))c.items=[];if(!Array.isArray(c.students))c.students=[];c.students.forEach(s=>{if(!s.grades||typeof s.grades!=='object')s.grades={};if(typeof s.firstName!=='string'){const a=String(s.name||'').trim().split(/\s+/);s.firstName=a.shift()||'';s.lastName=a.join(' ')};if(typeof s.notes!=='string')s.notes=''})}return c}
function calcValue(c,s,item,seen=new Set()){
 if(seen.has(item.id))return null;
 if(item.type!=='calculated'){
  const raw=s.grades?.[item.id];if(raw===undefined||String(raw).trim()==='')return null;
  const value=Number(String(raw).replace(',','.'));return Number.isFinite(value)?value:null;
 }
 if(!Array.isArray(item.weights)||!item.weights.length)return null;
 const next=new Set(seen);next.add(item.id);let result=0;
 for(const part of item.weights){const source=c.items.find(x=>x.id===part.id);if(!source)return null;const value=calcValue(c,s,source,next);if(value===null)return null;result+=value*Number(part.percent)/100}
 return Number.isFinite(result)?result:null;
}
function gradeColor(el,raw){const str=String(raw??'').trim();const value=str===''?NaN:Number(str.replace(',','.'));el.classList.toggle('grade-fail',Number.isFinite(value)&&value<5);el.classList.toggle('grade-pass',Number.isFinite(value)&&value>=5)}
function refreshCalculated(c){document.querySelectorAll('[data-calc]').forEach(el=>{const student=c.students.find(s=>s.id===el.dataset.student);const item=c.items.find(x=>x.id===el.dataset.calc);if(!student||!item)return;const value=calcValue(c,student,item);el.textContent=value===null?'—':value.toFixed(2).replace('.',',');gradeColor(el,value===null?'':value)})}
function displayName(s){return [s.firstName,s.lastName].filter(Boolean).join(' ')||s.name||''}
function orderedStudents(c){const a=[...c.students];if(c.orderMode!=='manual')a.sort((x,y)=>(x.lastName||'').localeCompare(y.lastName||'','ca',{sensitivity:'base'})||(x.firstName||'').localeCompare(y.firstName||'','ca',{sensitivity:'base'}));return a}
function buildIncidentsSection(s){
 const section=document.createElement('section');section.className='incidents-section';
 const heading=document.createElement('div');heading.className='incidents-heading';
 const title=document.createElement('h4');title.textContent='Incidències i reconeixements';
 const add=document.createElement('button');add.type='button';add.className='secondary';add.textContent='+ Nova incidència';
 const editor=document.createElement('div');editor.className='incident-editor';editor.hidden=true;
 const history=document.createElement('div');
 heading.append(title,add);section.append(heading,editor,history);
 const entries=()=>Array.isArray(s.incidents)?s.incidents:(s.incidents=[]);
 const dateInputValue=(date)=>{const d=new Date(date);if(Number.isNaN(d.getTime()))return '';const local=new Date(d.getTime()-d.getTimezoneOffset()*60000);return local.toISOString().slice(0,16)};
 const readableDate=(date)=>{const d=new Date(date);return Number.isNaN(d.getTime())?'Data desconeguda':new Intl.DateTimeFormat('ca-ES',{dateStyle:'medium',timeStyle:'short'}).format(d)};
 const openEditor=(entry=null)=>{
  editor.replaceChildren();editor.hidden=false;add.hidden=true;
  const heading=document.createElement('strong');heading.textContent=entry?'Editar incidència':'Registrar incidència';
  const grid=document.createElement('div');grid.className='incident-editor-grid';
  const typeWrap=document.createElement('div');const typeLabel=document.createElement('label');typeLabel.textContent='Tipus';
  const type=document.createElement('select');[['comportament','Comportament inadequat'],['respecte','Falta de respecte'],['expulsio','Expulsió de classe'],['tasques','Tasques / material'],['positiva','Reconeixement positiu'],['altres','Altres']].forEach(([value,text])=>{const option=document.createElement('option');option.value=value;option.textContent=text;type.append(option)});
  type.value=entry?.type||'comportament';typeWrap.append(typeLabel,type);
  const dateWrap=document.createElement('div');const dateLabel=document.createElement('label');dateLabel.textContent='Data i hora';
  const date=document.createElement('input');date.type='datetime-local';date.value=dateInputValue(entry?.occurredAt||new Date().toISOString());dateWrap.append(dateLabel,date);
  grid.append(typeWrap,dateWrap);
  const descLabel=document.createElement('label');descLabel.textContent='Descripció';
  const desc=document.createElement('textarea');desc.placeholder='Descriu els fets de manera objectiva...';desc.value=entry?.description||'';
  const error=document.createElement('p');error.className='error';
  const buttons=document.createElement('div');buttons.className='modal-actions';
  const cancel=document.createElement('button');cancel.type='button';cancel.className='secondary';cancel.textContent='Cancel·lar';cancel.onclick=()=>{editor.hidden=true;editor.replaceChildren();add.hidden=false};
  const ok=document.createElement('button');ok.type='button';ok.className='primary';ok.textContent=entry?'Desar canvis':'Desar incidència';
  ok.onclick=()=>{
   const description=desc.value.trim();const occurredAt=new Date(date.value);
   if(!description){error.textContent='Escriu una descripció.';return}
   if(!date.value||Number.isNaN(occurredAt.getTime())){error.textContent='Introdueix una data i hora vàlides.';return}
   if(entry){entry.type=type.value;entry.description=description;entry.occurredAt=occurredAt.toISOString();entry.updatedAt=new Date().toISOString()}
   else entries().push({id:uid(),type:type.value,description,occurredAt:occurredAt.toISOString(),createdAt:new Date().toISOString()});
   try{save()}catch(e){error.textContent='No s’ha pogut desar: '+e.message;return}
   cancel.click();draw();
  };
  buttons.append(cancel,ok);editor.append(heading,grid,descLabel,desc,error,buttons);desc.focus();
 };
 const draw=()=>{
  history.replaceChildren();const all=[...entries()].sort((a,b)=>new Date(b.occurredAt||0)-new Date(a.occurredAt||0));
  if(!all.length){const empty=document.createElement('p');empty.className='incident-empty';empty.textContent='Encara no hi ha incidències registrades.';history.append(empty);return}
  const labels={comportament:'Comportament inadequat',respecte:'Falta de respecte',expulsio:'Expulsió de classe',tasques:'Tasques / material',positiva:'Reconeixement positiu',altres:'Altres'};
  all.forEach(entry=>{
   const card=document.createElement('article');card.className='incident-card'+(entry.type==='positiva'?' positive':'');
   const meta=document.createElement('div');meta.className='incident-meta';
   const kind=document.createElement('strong');kind.textContent=labels[entry.type]||'Incidència';const when=document.createElement('span');when.textContent='· '+readableDate(entry.occurredAt);meta.append(kind,when);
   const description=document.createElement('p');description.className='incident-description';description.textContent=entry.description||'';
   const actions=document.createElement('div');actions.className='incident-actions';
   const edit=document.createElement('button');edit.type='button';edit.className='secondary';edit.textContent='Editar';edit.onclick=()=>openEditor(entry);
   const remove=document.createElement('button');remove.type='button';remove.className='secondary';remove.textContent='Eliminar';remove.onclick=()=>{if(!confirm('Vols eliminar aquesta incidència?'))return;s.incidents=entries().filter(x=>x.id!==entry.id);save();draw()};
   actions.append(edit,remove);card.append(meta,description,actions);history.append(card);
  });
 };
 add.onclick=()=>openEditor();draw();return section;
}

function openStudent(c,s){const root=document.getElementById('modalRoot');root.replaceChildren();const back=document.createElement('div');back.className='modal-back';const modal=document.createElement('div');modal.className='modal';const title=document.createElement('h3');title.textContent='Fitxa de l’alumne';const hint=document.createElement('p');hint.textContent=c.name+' · Les modificacions es desen automàticament';const firstLabel=document.createElement('label');firstLabel.textContent='Nom';const first=document.createElement('input');first.value=s.firstName||'';const lastLabel=document.createElement('label');lastLabel.textContent='Cognoms';const last=document.createElement('input');last.value=s.lastName||'';const profile=document.createElement('section');profile.className='profile-section';
 const ph=document.createElement('h4');ph.textContent='Informació acadèmica';profile.append(ph);
 const makeChoice=(text,key)=>{const row=document.createElement('div');row.className='profile-row';const label=document.createElement('label');label.textContent=text;const select=document.createElement('select');[['no','No'],['si','Sí']].forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;select.append(o)});select.value=s[key]==='si'?'si':'no';select.onchange=()=>{s[key]=select.value;save();if(key==='siblingsAtSchool')siblingArea.hidden=select.value!=='si'};row.append(label,select);profile.append(row);return select};
 makeChoice('Pla individualitzat (PI)','pi');makeChoice('Repetidor/a','repeater');const siblingChoice=makeChoice('Germans al centre','siblingsAtSchool');
 const siblingArea=document.createElement('div');const siblingTitle=document.createElement('label');siblingTitle.textContent='Germans / germanes (nom i curs)';siblingArea.append(siblingTitle);const siblingRows=document.createElement('div');siblingArea.append(siblingRows);
 const siblingList=()=>Array.isArray(s.siblings)?s.siblings:(s.siblings=[]);
 const drawSiblings=()=>{siblingRows.replaceChildren();siblingList().forEach((sib,i)=>{const row=document.createElement('div');row.className='sibling-entry';const n=document.createElement('input');n.placeholder='Nom i cognoms';n.value=sib.name||'';const course=document.createElement('input');course.placeholder='Curs';course.value=sib.course||'';const del=document.createElement('button');del.type='button';del.className='mini-remove';del.textContent='×';del.title='Eliminar germà/ana';n.oninput=()=>{sib.name=n.value;save()};course.oninput=()=>{sib.course=course.value;save()};del.onclick=()=>{s.siblings.splice(i,1);save();drawSiblings()};row.append(n,course,del);siblingRows.append(row)})};
 const addSibling=document.createElement('button');addSibling.type='button';addSibling.className='secondary';addSibling.textContent='+ Afegir germà/ana';addSibling.onclick=()=>{siblingList().push({name:'',course:''});save();drawSiblings()};siblingArea.append(addSibling);profile.append(siblingArea);siblingArea.hidden=siblingChoice.value!=='si';drawSiblings();
 const joinedLabel=document.createElement('label');joinedLabel.textContent='Data d’incorporació (opcional)';const joined=document.createElement('input');joined.type='date';joined.value=s.joinedDate||'';joined.onchange=()=>{s.joinedDate=joined.value;save()};profile.append(joinedLabel,joined);
 const pendingLabel=document.createElement('label');pendingLabel.textContent='Matèries pendents (opcional)';const pending=document.createElement('input');pending.placeholder='Ex.: Matemàtiques de 1r';pending.value=s.pendingSubjects||'';pending.oninput=()=>{s.pendingSubjects=pending.value;save()};profile.append(pendingLabel,pending);
 const noteLabel=document.createElement('label');noteLabel.textContent='Observacions';const notes=document.createElement('textarea');notes.className='student-notes';notes.placeholder='Anotacions acadèmiques...';notes.value=s.notes||'';const saveField=()=>{s.firstName=first.value;s.lastName=last.value;s.name=displayName(s);s.notes=notes.value;save()};[first,last,notes].forEach(el=>el.addEventListener('input',saveField));const info=document.createElement('p');info.className='note-hint';info.textContent='Evita introduir dades personals sensibles: la informació es guarda en aquest navegador.';const actions=document.createElement('div');actions.className='modal-actions';const closeBtn=document.createElement('button');closeBtn.className='primary';closeBtn.textContent='Tancar';const close=()=>{saveField();root.replaceChildren();render()};closeBtn.onclick=close;back.onclick=e=>{if(e.target===back)close()};actions.append(closeBtn);modal.append(title,hint,firstLabel,first,lastLabel,last,profile,noteLabel,notes,buildIncidentsSection(s),buildStudentAttendanceSection(c,s),info,actions);back.append(modal);root.append(back);first.focus()}
function openNewStudent(c){const root=document.getElementById('modalRoot');root.replaceChildren();const back=document.createElement('div');back.className='modal-back';const modal=document.createElement('div');modal.className='modal';const title=document.createElement('h3');title.textContent='Afegir alumne';const label1=document.createElement('label');label1.textContent='Nom';const first=document.createElement('input');first.placeholder='Nom';const label2=document.createElement('label');label2.textContent='Cognoms';const last=document.createElement('input');last.placeholder='Cognoms';const error=document.createElement('p');error.className='error';const actions=document.createElement('div');actions.className='modal-actions';const cancel=document.createElement('button');cancel.className='secondary';cancel.textContent='Cancel·lar';cancel.onclick=()=>root.replaceChildren();const ok=document.createElement('button');ok.className='primary';ok.textContent='Afegir alumne';ok.onclick=()=>{if(!first.value.trim()||!last.value.trim()){error.textContent='Introdueix el nom i els cognoms.';return}const f=first.value.trim(),l=last.value.trim();c.students.push({id:uid(),firstName:f,lastName:l,name:f+' '+l,notes:'',grades:{}});save();root.replaceChildren();render()};last.onkeydown=e=>{if(e.key==='Enter')ok.click()};actions.append(cancel,ok);modal.append(title,label1,first,label2,last,error,actions);back.append(modal);back.onclick=e=>{if(e.target===back)root.replaceChildren()};root.append(back);first.focus()}
function render(){
 renderSchedule();
 const list=document.getElementById('classes');list.replaceChildren();
 data.classes.forEach(c=>{let b=document.createElement('button');b.className='class-btn'+(current()?.id===c.id?' active':'');let n=document.createElement('span');n.textContent=c.name;let count=document.createElement('span');count.className='count';count.textContent=c.students.length;b.append(n,count);b.onclick=()=>{data.active=c.id;save();render()};list.append(b)});
 let c=current();if(c&&!Array.isArray(c.items))c.items=[];document.getElementById('classTitle').textContent=c?.name||'Cap classe';document.getElementById('classInfo').textContent=c?`${c.students.length} alumnes`:'Crea una classe per començar';document.getElementById('editTutor').hidden=!c;document.getElementById('tutorName').textContent=c?.tutor?.trim()||'Afegir nom';['renameClass','deleteClass','addStudent','addItem'].forEach(id=>document.getElementById(id).disabled=!c);
 let area=document.getElementById('tableArea');const previousSearch=area.querySelector('.search-input')?.value??'';area.replaceChildren();if(!c){area.innerHTML='<div class="empty">Encara no hi ha classes.</div>';return}
 let bar=document.createElement('div');bar.className='sort-bar';let sortLabel=document.createElement('span');sortLabel.textContent='Ordenació';let selector=document.createElement('select');selector.innerHTML='<option value="alphabetical">Alfabètica per cognoms</option><option value="manual">Manual · arrossegar</option>';selector.value=c.orderMode==='manual'?'manual':'alphabetical';selector.onchange=()=>{if(selector.value==='manual'&&c.orderMode!=='manual')c.students=orderedStudents(c);c.orderMode=selector.value;save();render()};bar.append(sortLabel,selector);let search=document.createElement('input');search.type='search';search.className='search-input';search.placeholder='Cerca un alumne...';search.setAttribute('aria-label','Cerca un alumne');search.value=previousSearch;search.style.marginLeft='auto';bar.append(search);let searchCount=document.createElement('span');searchCount.className='search-count';bar.append(searchCount);

function validBackup(candidate){
 if(!candidate||typeof candidate!=='object'||Array.isArray(candidate)||!Array.isArray(candidate.classes))return false;
 if(candidate.classes.length>500)return false;
 const ids=new Set();
 for(const c of candidate.classes){
  if(!c||typeof c!=='object'||typeof c.id!=='string'||!c.id||ids.has(c.id)||typeof c.name!=='string'||!Array.isArray(c.students)||!Array.isArray(c.items||[]))return false;
  ids.add(c.id);
  if(c.students.length>10000||(c.items||[]).length>1000)return false;
  const itemIds=new Set();
  for(const item of c.items||[]){
   if(!item||typeof item.id!=='string'||!item.id||itemIds.has(item.id)||typeof item.name!=='string')return false;
   itemIds.add(item.id);
   if(item.type==='calculated'&&(!Array.isArray(item.weights)||item.weights.some(w=>!w||typeof w.id!=='string'||!Number.isFinite(Number(w.percent)))))return false;
  }
  const studentIds=new Set();
  for(const student of c.students){
   if(!student||typeof student.id!=='string'||!student.id||studentIds.has(student.id)||(!('name' in student)&&typeof student.firstName!=='string')|| (student.grades!==undefined&&(!student.grades||typeof student.grades!=='object'||Array.isArray(student.grades))))return false;
   studentIds.add(student.id);
  }
 }
 return true;
}

let excelLibraryPromise=null;
function loadExcelLibrary(){
 if(window.XLSX)return Promise.resolve(window.XLSX);
 if(excelLibraryPromise)return excelLibraryPromise;
 excelLibraryPromise=new Promise((resolve,reject)=>{
  const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
  script.onload=()=>window.XLSX?resolve(window.XLSX):reject(Error('Biblioteca Excel no disponible'));
  script.onerror=()=>reject(Error('No es pot carregar el lector d’Excel. Comprova la connexió a Internet.'));
  document.head.append(script);
 }).catch(e=>{excelLibraryPromise=null;throw e});return excelLibraryPromise;
}
const excelFileInput=document.getElementById('excelFile');

excelFileInput.onchange=async()=>{
 const file=excelFileInput.files?.[0];excelFileInput.value='';if(!file)return;
 if(file.size>15*1024*1024){alert('El fitxer supera el límit de 15 MB.');return}
 const button=document.getElementById('importExcel');button.disabled=true;button.textContent='Llegint Excel…';
 try{
  const XLSX=await loadExcelLibrary();const buf=await file.arrayBuffer();
  const book=XLSX.read(buf,{type:'array',cellFormula:true,cellDates:false,cellNF:false});
  const sheets=book.SheetNames.map(name=>{
   const sheet=book.Sheets[name];const range=XLSX.utils.decode_range(sheet['!ref']||'A1');
   const endRow=Math.min(range.e.r,10009),endCol=Math.min(range.e.c,99);
   const rows=[];let formulaCount=0;
   for(let r=range.s.r;r<=endRow;r++){
    const line=[];let nonempty=false;
    for(let col=range.s.c;col<=endCol;col++){
     const cell=sheet[XLSX.utils.encode_cell({r,c:col})];
     if(cell?.f)formulaCount++;
     let value=cell?.v??'';
     if(value instanceof Date)value=value.toLocaleDateString('ca-ES');
     if(typeof value==='number'&&Number.isFinite(value))value=String(Number(value.toPrecision(12)));
     value=String(value).trim();line.push(value);if(value)nonempty=true;
    }
    rows.push(line);
   }
   return {name,rows,formulaCount,offset:range.s.r};
  });

 }catch(e){alert('No s’ha pogut obrir el full de càlcul: '+e.message)}
 finally{button.disabled=false;button.textContent='↑ Importar Excel'}
};
function excelNorm(v){return String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase()}
function excelNumber(v){const raw=String(v??'').trim().replace(/\s/g,'');if(!raw)return null;let n=raw;if(/^[-+]?\d{1,3}(\.\d{3})+,\d+$/.test(n))n=n.replace(/\./g,'').replace(',','.');else if(n.includes(',')&&!n.includes('.'))n=n.replace(',','.');if(!/^[-+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(n))return null;const num=Number(n);return Number.isFinite(num)?num:null}
function excelGuess(sheet){
 const rows=sheet.rows;let best={score:-Infinity,header:0,nameCol:0};
 for(let r=0;r<Math.min(20,rows.length);r++)for(let col=0;col<Math.min(12,rows[r].length);col++){
  const v=excelNorm(rows[r][col]);let score=0;
  if(/^(nom|nombre)( i cognoms| y apellidos| complet| completo)?$/.test(v))score+=16;
  else if(v.includes('cognoms')||v.includes('apellidos')||v.includes('alumne')||v.includes('alumno'))score+=10;
  else if(v==='nom'||v==='nombre')score+=12;
  if(/^(llista|lista|n[uú]m|num|nº|#)$/.test(v))score-=12;
  const below=rows.slice(r+1,r+Math.min(rows.length-r,10)).filter(x=>{
   const t=String(x[col]||'').trim();return t.length>=3&&/[A-Za-zÀ-ÿ]/.test(t)&&!/^grupo?\s*\d+$/i.test(t)
  }).length;
  score+=below*1.2;if(v)score+=1;
  if(score>best.score)best={score,header:r,nameCol:col};
 }
 if(!rows.length)return {header:0,nameCol:0,columns:[]};
 const {header,nameCol}=best;
 const headers=rows[header]||[];
 const columns=headers.map((v,i)=>({i,name:String(v||'').trim()})).filter(x=>x.i!==nameCol&&x.name&&!/^(llista|lista|n[uú]m|num|nº|#|classe|clase|grupo|grup)$/i.test(excelNorm(x.name)));
 return {header,nameCol,columns};
}
function excelCandidateRow(row,nameCol){
 const name=String(row?.[nameCol]??'').trim();const norm=excelNorm(name);
 return name.length>=2&&/[A-Za-zÀ-ÿ]/.test(name)&&!/^\d+$/.test(name)&&!/^grup(o)?\s*\d+$/i.test(name)&&!/(^nom$|^nombre$|^alumn|^total$|^mitjana$|^media$)/i.test(norm)&&name.length<140;
}

function excelExtract(cfg){
 const {sheet}=cfg,header=Number(cfg.headerSelect.value),nameCol=Number(cfg.nameSelect.value),mode=cfg.modeSelect.value;
 const rows=sheet.rows;const headings=rows[header]||[];

 if(mode!=='none')for(let col=0;col<Math.max(...rows.slice(0,30).map(r=>r.length),0);col++){
  if(col===nameCol)continue;
  let heading=String(headings[col]||'').trim();
  if(!heading||/^(llista|lista|n[uú]m|num|nº|#|classe|clase|grup|grupo)$/i.test(excelNorm(heading)))continue;
  const vals=candidates.map(row=>String(row[col]??'').trim()).filter(Boolean);
  const nums=vals.filter(v=>{const n=excelNumber(v);return n!==null&&n>=0&&n<=10});
  if(mode==='numeric'&&(!nums.length||nums.length/Math.max(1,vals.length)<.7))continue;
  cols.push({index:col,id:uid(),name:heading});
 }
 const students=candidates.map(row=>{
  const full=String(row[nameCol]).trim().replace(/\s+/g,' ');const parts=full.split(' ');const firstName=parts.shift()||'';const lastName=parts.join(' ');

  return {id:uid(),name:full,firstName,lastName,grades,notes:''};
 });
 return {name:cfg.name.value.trim(),items:cols.map(({id,name})=>({id,name})),students};
}

function centreDB(){return new Promise((resolve,reject)=>{
 const req=indexedDB.open('paideia-centre-files',1);
 req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('files'))req.result.createObjectStore('files')};
 req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
})}
async function centreFileAction(mode,value){const db=await centreDB();try{return await new Promise((resolve,reject)=>{
 const tx=db.transaction('files',mode==='get'?'readonly':'readwrite');const store=tx.objectStore('files');
 const req=mode==='get'?store.get('calendar'):mode==='delete'?store.delete('calendar'):store.put(value,'calendar');
 req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);tx.onerror=()=>reject(tx.error);
})}finally{db.close()}}
const readCentrePdf=()=>centreFileAction('get');
const storeCentrePdf=(name,blob)=>centreFileAction('put',{name,blob,updatedAt:new Date().toISOString()});
const deleteCentrePdf=()=>centreFileAction('delete');
function blobToBase64(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=()=>reject(r.error);r.readAsDataURL(blob)})}
function base64ToBlob(base64){const binary=atob(base64),parts=[];for(let i=0;i<binary.length;i+=32768){const part=binary.slice(i,i+32768);parts.push(Uint8Array.from(part,c=>c.charCodeAt(0)))}return new Blob(parts,{type:'application/pdf'})}
function downloadCentrePdf(pdf){const url=URL.createObjectURL(pdf.blob);const a=document.createElement('a');a.href=url;a.download=pdf.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}

 })};drawRoles();const add=document.createElement('button');add.type='button';add.className='secondary';add.textContent='+ Afegir càrrec';add.onclick=()=>{centre.roles.push({id:uid(),title:'',person:''});save();drawRoles();list.lastElementChild?.querySelector('input')?.focus()};roles.append(add);panel.append(roles);
 const calendar=document.createElement('section');calendar.className='centre-section';const ch=document.createElement('h3');ch.textContent='Calendari escolar 2026–2027';calendar.append(ch);

let commsVisible=false;

function commsRecipientsText(entry){const c=data.classes.find(x=>x.id===entry.classId);if(!c)return 'Classe eliminada';if(entry.scope==='class')return 'Tota la classe · '+c.name;const names=(entry.studentIds||[]).map(id=>c.students.find(x=>x.id===id)).filter(Boolean).map(displayName);return names.length?c.name+' · '+names.join(', '):c.name+' · Destinataris no disponibles'}
function openCommunication(entry=null){
 simpleModal(entry?'Editar comunicat':'Nou comunicat','Els comunicats es guarden només com a esborranys. Encara no es poden enviar a les famílies.',(modal,close)=>{
 modal.classList.add('comms-editor');

 const classes=document.createElement('select');data.classes.forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=c.name;classes.append(o)});classes.value=entry?.classId||data.active||data.classes[0]?.id||'';field('Classe',classes);
 const scope=document.createElement('select');[['class','Totes les famílies de la classe'],['selected','Famílies d’alumnes seleccionats']].forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;scope.append(o)});scope.value=entry?.scope||'class';field('Destinataris',scope);
 const studentBox=document.createElement('div');studentBox.className='comms-students';modal.append(studentBox);

 const subject=document.createElement('input');subject.value=entry?.subject||'';subject.placeholder='Assumpte del comunicat';field('Assumpte',subject);
 const body=document.createElement('textarea');body.value=entry?.body||'';body.placeholder='Benvolgudes famílies, ...';field('Missatge',body);
 const error=document.createElement('p');error.className='error';modal.append(error);
 const actions=document.createElement('div');actions.className='modal-actions';const cancel=document.createElement('button');cancel.className='secondary';cancel.textContent='Cancel·lar';cancel.onclick=close;const saveBtn=document.createElement('button');saveBtn.className='primary';saveBtn.textContent='Desar esborrany';saveBtn.onclick=()=>{
 if(!classes.value||!subject.value.trim()||!body.value.trim()){error.textContent='Selecciona una classe i escriu l’assumpte i el missatge.';return}
 if(scope.value==='selected'&&!selected.size){error.textContent='Selecciona almenys un alumne.';return}
 const payload={id:entry?.id||uid(),classId:classes.value,scope:scope.value,studentIds:scope.value==='selected'?[...selected]:[],subject:subject.value.trim(),body:body.value.trim(),status:'draft',createdAt:entry?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};
 if(entry)Object.assign(entry,payload);else commsList().unshift(payload);
 try{save()}catch(e){error.textContent='No s’ha pogut desar: '+e.message;return}close();renderComms()};actions.append(cancel,saveBtn);modal.append(actions);subject.focus();
 });
}

// Assistència: un registre per grup, data i sessió. Inclosa en les còpies JSON.
let attendanceVisible=false;
let attendanceSelection={classId:'',date:new Date().toLocaleDateString('sv-SE'),sessionKey:'manual-1'};
function attendanceEntries(){if(!Array.isArray(data.attendance))data.attendance=[];return data.attendance}
function attendanceDate(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
attendanceSelection.date=attendanceDate();
function attendanceSlots(classId,date){const day=(new Date(date+'T12:00:00').getDay()+6)%7;const result=[{key:'manual-1',label:'Sessió manual (1)'}];if(day>4)return result;const schedule=ensureSchedule();schedule.rows.forEach((row,i)=>{const cell=row.cells?.[day];if(!cell)return;const linked=cell.classId||scheduleClassGuess(cell.title);if(linked===classId)result.push({key:'horari-'+day+'-'+i,label:'Franja '+(i+1)+(row.time?' · '+row.time:'')+(cell.title?' · '+cell.title:'')})});return result}
function attendanceLabel(key,date,classId){const slots=attendanceSlots(classId,date);const slot=slots.find(x=>x.key===key);if(slot)return slot.label;if(key.startsWith('horari-')){const i=Number(key.split('-')[2]);return 'Franja '+(i+1)}return key==='manual-1'?'Sessió manual (1)':key.replace(/^manual-/,'Sessió manual ')}
function attendanceRecord(classId,date,key){return attendanceEntries().find(x=>x.classId===classId&&x.date===date&&x.sessionKey===key)}
function openAttendance(classId=data.active,rowIndex=null,dayIndex=null){attendanceSelection.classId=classId||data.classes[0]?.id||'';attendanceSelection.date=attendanceDate();attendanceSelection.sessionKey=rowIndex!==null&&dayIndex!==null?'horari-'+dayIndex+'-'+rowIndex:'manual-1';attendanceVisible=true;renderAttendance();document.getElementById('attendancePanel').scrollIntoView({behavior:'smooth',block:'start'})}
function renderAttendance(){const panel=document.getElementById('attendancePanel');panel.hidden=!attendanceVisible;document.getElementById('toggleAttendance').textContent=attendanceVisible?'✓ Amagar llista':'✓ Passar llista';if(!attendanceVisible)return;panel.replaceChildren();
 const head=document.createElement('div');head.className='attendance-head';const h=document.createElement('h2');h.textContent='Passar llista';const close=document.createElement('button');close.className='secondary';close.textContent='Tancar';close.onclick=()=>{attendanceVisible=false;renderAttendance()};head.append(h,close);panel.append(head);
 const controls=document.createElement('div');controls.className='attendance-controls';
 const field=(name,el)=>{const wrap=document.createElement('label');wrap.textContent=name;wrap.append(el);controls.append(wrap);return el};
 const classes=document.createElement('select');data.classes.forEach(c=>classes.add(new Option(c.name,c.id)));if(!data.classes.some(c=>c.id===attendanceSelection.classId))attendanceSelection.classId=data.classes[0]?.id||'';classes.value=attendanceSelection.classId;field('Grup',classes);
 const date=document.createElement('input');date.type='date';date.value=attendanceSelection.date;field('Data',date);
 const session=document.createElement('select');field('Sessió',session);panel.append(controls);
 const note=document.createElement('p');note.className='attendance-summary';panel.append(note);
 const list=document.createElement('div');list.className='attendance-list';panel.append(list);
 const actions=document.createElement('div');actions.className='attendance-actions';panel.append(actions);
 const feedback=document.createElement('p');feedback.className='attendance-summary attendance-feedback';feedback.setAttribute('role','status');feedback.setAttribute('aria-live','polite');panel.append(feedback);
 let feedbackTimer=null;
 const showAttendanceFeedback=(message,isError=false)=>{clearTimeout(feedbackTimer);feedback.textContent=message;feedback.classList.toggle('attendance-feedback-error',isError);feedback.hidden=false;if(!isError)feedbackTimer=setTimeout(()=>{feedback.hidden=true;feedback.textContent=''},5000)};
 feedback.hidden=true;
 const reload=()=>{
  const c=data.classes.find(x=>x.id===attendanceSelection.classId);session.replaceChildren();const slots=attendanceSlots(attendanceSelection.classId,attendanceSelection.date);const existing=attendanceEntries().filter(x=>x.classId===attendanceSelection.classId&&x.date===attendanceSelection.date);for(const r of existing)if(!slots.some(x=>x.key===r.sessionKey))slots.push({key:r.sessionKey,label:attendanceLabel(r.sessionKey,r.date,r.classId)});slots.push({key:'new',label:'+ Afegir una altra sessió manual'});
  slots.forEach(x=>session.add(new Option(x.label,x.key)));if(!slots.some(x=>x.key===attendanceSelection.sessionKey))attendanceSelection.sessionKey='manual-1';session.value=attendanceSelection.sessionKey;
  const record=attendanceRecord(attendanceSelection.classId,attendanceSelection.date,attendanceSelection.sessionKey);const values=record?.statuses||{};
  list.replaceChildren();actions.replaceChildren();clearTimeout(feedbackTimer);feedback.hidden=true;feedback.textContent='';
  if(!c){note.textContent='No hi ha cap grup disponible.';return}
  const controlsByStudent=new Map();orderedStudents(c).forEach(s=>{const row=document.createElement('div');row.className='attendance-person';const name=document.createElement('strong');name.textContent=displayName(s);const sel=document.createElement('select');[['present','Present'],['absent','Absència'],['late','Retard'],['justified','Absència justificada']].forEach(([v,t])=>sel.add(new Option(t,v)));sel.value=values[s.id]||'present';controlsByStudent.set(s.id,sel);row.append(name,sel);list.append(row)});
  const updateSummary=()=>{const all=[...controlsByStudent.values()].map(x=>x.value);note.textContent=`${c.students.length} alumnes · ${all.filter(x=>x==='absent'||x==='justified').length} absències · ${all.filter(x=>x==='late').length} retards`};controlsByStudent.forEach(sel=>sel.onchange=updateSummary);updateSummary();
  if(record){const del=document.createElement('button');del.className='secondary';del.textContent='Eliminar registre';del.onclick=()=>{if(!confirm('Eliminar el registre d’assistència d’aquesta sessió?'))return;data.attendance=attendanceEntries().filter(x=>x!==record);save();reload()};actions.append(del)}
  const saveBtn=document.createElement('button');saveBtn.className='primary';saveBtn.textContent=record?'Actualitzar llista':'Desar llista';saveBtn.onclick=()=>{const wasUpdate=saveBtn.textContent==='Actualitzar llista';const statuses={};controlsByStudent.forEach((sel,id)=>{if(sel.value!=='present')statuses[id]=sel.value});const existing=attendanceRecord(c.id,attendanceSelection.date,attendanceSelection.sessionKey);if(existing){existing.statuses=statuses;existing.updatedAt=new Date().toISOString()}else attendanceEntries().push({id:uid(),classId:c.id,date:attendanceSelection.date,sessionKey:attendanceSelection.sessionKey,statuses,createdAt:new Date().toISOString()});try{save();reload();showAttendanceFeedback(wasUpdate?'✓ La llista s’ha actualitzat correctament.':'✓ La llista s’ha desat correctament.')}catch(e){showAttendanceFeedback('No s’ha pogut desar: '+e.message,true)}};actions.append(saveBtn);
  if(record){const info=document.createElement('span');info.className='attendance-summary';info.textContent='Sessió registrada · pots corregir-la';actions.prepend(info)}
 };
 classes.onchange=()=>{attendanceSelection.classId=classes.value;attendanceSelection.sessionKey='manual-1';reload()};date.onchange=()=>{attendanceSelection.date=date.value;attendanceSelection.sessionKey='manual-1';reload()};session.onchange=()=>{if(session.value==='new'){let i=2;while(attendanceRecord(attendanceSelection.classId,attendanceSelection.date,'manual-'+i))i++;attendanceSelection.sessionKey='manual-'+i}else attendanceSelection.sessionKey=session.value;reload()};reload();
}
function buildStudentAttendanceSection(c,s){const section=document.createElement('section');section.className='attendance-profile';const title=document.createElement('h4');title.textContent='Absències i retards';section.append(title);
 const rows=attendanceEntries().filter(r=>r.classId===c.id&&['absent','late','justified'].includes(r.statuses?.[s.id])).sort((a,b)=>b.date.localeCompare(a.date)||b.sessionKey.localeCompare(a.sessionKey));const abs=rows.filter(r=>r.statuses[s.id]!=='late').length,late=rows.filter(r=>r.statuses[s.id]==='late').length;
 const metrics=document.createElement('div');metrics.className='attendance-metrics';for(const [label,value] of [['Absències',abs],['Retards',late]]){const tile=document.createElement('div');const strong=document.createElement('strong');strong.textContent=value;const caption=document.createElement('span');caption.textContent=label;tile.append(strong,caption);metrics.append(tile)}section.append(metrics);
 if(!rows.length){const p=document.createElement('p');p.className='note-hint';p.textContent='No hi ha absències ni retards registrats en aquest grup.';section.append(p)}else{const wrap=document.createElement('div');wrap.className='attendance-history table-wrap';const table=document.createElement('table');const head=document.createElement('thead');head.innerHTML='<tr><th>Data</th><th>Sessió</th><th>Estat</th></tr>';table.append(head);const body=document.createElement('tbody');rows.forEach(r=>{const tr=document.createElement('tr');const d=document.createElement('td');const parts=r.date.split('-');d.textContent=parts.length===3?parts.reverse().join('/'):r.date;const slot=document.createElement('td');slot.textContent=attendanceLabel(r.sessionKey,r.date,c.id);const state=document.createElement('td');state.textContent=r.statuses[s.id]==='late'?'Retard':r.statuses[s.id]==='justified'?'Absència justificada':'Absència';tr.append(d,slot,state);body.append(tr)});table.append(body);wrap.append(table);section.append(wrap)}
 const action=document.createElement('button');action.type='button';action.className='secondary';action.textContent='✓ Passar llista del grup';action.onclick=()=>{document.getElementById('modalRoot').replaceChildren();openAttendance(c.id)};section.append(action);return section;
}
document.getElementById('toggleAttendance').onclick=()=>{if(attendanceVisible){attendanceVisible=false;renderAttendance()}else openAttendance(data.active)};

save();render();
